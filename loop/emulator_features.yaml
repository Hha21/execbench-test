# Per-path design features of kernels with portal results, for the multi-fidelity emulator (loop/emulator.py).
# A kernel is a list of code paths; each path serves input sizes up to max_tokens (B*S; null = everything above).
# New candidates carry the same block in their design card under `paths:`.
#
# Fields (defaults in brackets):
#   lang: triton | cuda | cute          width: 128 | 256 (bits per global access)   cluster: 1 | 2 | 4... [1]
#   threads: CTA threads [256]          rows: rows of 128 floats per CTA [16]
#   grid: oneshot | persistent          mem: ldg | tma | cpasync [ldg]       wstat: weight-stationary [false]
#   launches: 1 | 2 [1]                 prefetch: L2 bulk prefetch of the tile [false]
#   x: none | ef  (streamed Q/K loads)  w: none | el | nc (weight loads)    st: none | ef | el (output stores)

