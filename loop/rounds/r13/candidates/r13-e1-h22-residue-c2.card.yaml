id: r13-e1-h22-residue-c2
parents:
  - c2-cluster2-s-only
operation: new_design
language: cuda_cpp
niche:
  mem: ldg256
  st: direct
  grid: oneshot
  launch: fused
  tile: rows16
  red: halfwarp
  cache: stream
  spec: dispatch:size
tests:
  - H22
  - H23
hypothesis: >-
  E1 probe session (H22). The harness's 252 MB zero-fill flush leaves L2 holding about 60-90 MB of the newest dirty
  lines on top of roughly 36-40 MB of older clean room. Every L2 line our kernel allocates beyond that clean room
  evicts a dirty residue line, and the write-back of that line lands inside the timed window. The cost is about
  0.13 us per residue MB when the kernel is DRAM-saturated (8192 tokens, roughly the write time at about 7.7 TB/s),
  about 0.09 us/MB at 2048, 0.05 at 1024 and 0.015 at 586, where the write-back overlaps the read phases. It levels
  off at about 65-90 MB, which is all the residue there is.
  Evict_last stores fill the clean room first, and evict_first loads keep reads from using it, so EF+EL pays only
  the flat ~0.45 us while the output is under ~40 MB (586 tokens). Beyond the clean room, no hint changes which line
  gets evicted. Every policy tested ties or loses: EL loads, st.wt, qualifier-form EL, applypriority demotion of own
  outputs or inputs, bulk-async stores, mid-grid load-policy switches. The dirty cost is a fixed property of output
  bytes minus clean room. The code is c2 unchanged.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: 0
    confidence: high
  L:
    pct: 0
    confidence: high
resources_sm100a:
  regs_per_thread: 30
  smem_per_cta_bytes: 0
  threads_per_cta: 256
  ctas_per_sm: 8
  bytes_in_flight_per_sm: 65536
  launches_per_call: 1
knobs:
  THREADS: 256
  R_S: 1
  R_1024: 3
  R_ML: 1
dispatch:
  - {max_tokens: 300, kernel: qk_rms_rtok, meta: {R: 1, LOAD_S: true, cluster: 2}}
  - {max_tokens: 600, kernel: qk_rms_rtok, meta: {R: 1, LOAD_S: true}}
  - {max_tokens: 1100, kernel: qk_rms_rtok, meta: {R: 3, LOAD_S: false}}
  - {max_tokens: null, kernel: qk_rms_rtok, meta: {R: 1, LOAD_S: false}}
findings:
  - "harness order per timed call: copy inputs + zero outputs (ShiftingMemoryPool), cudaCtxResetPersistingL2Cache, then zero the 252 MB flush buffer; the flush is the last write before run() [source read via probe_b200]"
  - "probe E1 step 1 (clean flush = zero + int64 max read of the buffer, then X MB of plain fill_ to rotating private scratch; c2 paths, 5 interleaved reps, medians; cost(X) = t(X) - t(X=0), us). 586 tok (R1 EF+EL): X10..40 -0.1..-0.1, X60 +0.34, X90 +0.61, X120 +0.61, dirty-clean 0.61. 1024 (R3 EL): X10..40 -0.16..+0.22, X60 +1.06, X90 +1.41, X120 +1.41, dirty 1.38. 2048 (R1 EL): X10 +0.08, X20 +0.39, X30 +0.88, X40 +1.80, X60 +4.00, X90 +4.43, X120 +4.41, dirty 4.40. 8192: X10 +0.60, X20 +2.00, X30 +3.37, X40 +4.63, X60 +6.65, X90 +7.02, X120 +7.04, dirty 6.97 [probe_b200]"
  - "H22 core assumption supported: cost depends on residue size, rises about linearly (0.13 us/MB at 8192, 0.09 at 2048, 0.05 at 1024, 0.015 at 586) after a size-dependent free threshold (about 40 MB at 586-1024, about 10-20 MB at 2048, about 0 at 8192), and levels off at X of about 60-90 MB. X >= 90 MB reproduces the harness dirty flush within 0.05 us (<= 1%) at all four sizes, so the real flush is equivalent to >= 60-90 MB of the newest dirty lines [probe_b200]"
  - "probe E1 step 2 (5 reps; dirty / clean / X120, us; R=1 unless noted). 586: L0+EL 9.39/8.24/9.39; EF+EL 8.67/8.24/8.71; (a) ELld+EL 9.55 (+1.7% vs c2); (b) L0+wt 11.23 (+19.6%), EF+wt 11.15; (c) L0+ELqualifier 9.38, EF+ELq 8.74; (d) EF+EL+applypriority own output 11.01 (+17%), lagged demotion 20 MB 8.91, 40 MB 8.61; (e) EF+EL+apIn 8.99, L0+EL+apIn 9.57; R3 10.03 [probe_b200]"
  - "probe E1 step 2 at 1024 (vs c2 R3 14.04 dirty): L0+EL +1.8%, EF+EL -0.3%, (a) +5.4%, (b) +23.6%, (c) L0 +2.1% / EF -0.4%, (d) own +22.1%, lag20 +2.4%, lag40 -0.4%, (e) EF +1.2% / L0 +4.7%. At 2048 (vs c2 R1 28.25): EF+EL +1.9%, (a) +5.4%, (b) +14.5%, (c) +0.2%/+1.6%, (d) +13.4/+4.5/+0.8%, (e) EF +2.2% / L0 -0.4%, R3 +0.9%. X120 equals dirty within 0.15 us in every cell [probe_b200]"
  - "dead end: st.global.wt behaves like plain stores (pays the full non-EL dirty cost: 3.0/4.7/7.6 us at 586/1024/2048) [probe_b200]"
  - "dead end: qualifier-form st.global.L2::evict_last needs .v8.b32/.v4.b64 (ptxas rejects f32 scalars); on v8 it is identical to createpolicy evict_last within 0.5% [probe_b200]"
  - "dead end: applypriority.global.L2::evict_normal on the own output just stored ~= plain stores (+17-22%) and costs +0.4-0.6 us even after a clean flush; demotion of the tile stored 20/40 MB earlier ties or loses; demoting the input just read adds 0.3-0.9 us clean and saves at most 1 us of dirty cost (2048 L0) for a net -0.4% [probe_b200]"
  - "dead end (H23): cp.async.bulk stores (smem-staged, 1 KB per warp, wait_group.read before exit) allocate like STG: with EL hint 9.71/15.11/28.46 us dirty vs STG EL 9.41/14.42/28.53 at 586/1024/2048; without hint +19-20% like plain STG. The async proxy does not avoid residue eviction. H23 refuted for the L2 state [probe_b200]"
  - "dead end: switching x loads EF<->default at a fraction of the grid (EF first 25/50/75%, default first 25/50%) at 1024/2048: best -2.0% vs R1 L0+EL at 1024 (about c2's R3 level), -0.5% at 2048; at 586 all variants are worse than pure EF [probe_b200]"
  - "mechanism (H22): L2 after the harness flush ~= ~36-40 MB of older clean room plus >= 60-90 MB of newest dirty residue. Allocations first take the clean room (EL stores fill it, EF loads recycle and do not use it); after that every allocation evicts residue whatever its hint, and that write-back is timed. The minimum dirty cost is set by output bytes minus clean room, not by policy; c2 already sits at it (586: 0.43-0.6 us; 1024: 1.4 us = ~10 MB over the room; 2048: 4.2-4.4 us). A per-size slope matches step 1 within about 10%; with one constant slope it overpredicts 2048 (r12 EF+EL 5.76 us vs ~8 us predicted), because write-back overlaps read-bound phases at M [inferred from probes]"
  - "verdict: success criterion part 1 met (X >= 90 MB reproduces the dirty flush within 1% at 586/1024/2048/8192); part 2 not met, no combination cuts dirty-minus-clean by >= 0.5 us at 1024 or >= 1 us at 2048 in net time. Stop spending slots on L2 policy at M/L; the H7 pool (dirty cost) is not reachable through cache hints, so H24's 'halve H7' route looks closed for hint-based kernels [probe_b200]"
  - "run_tests (code identical to c2, comments only): 16/16 pass; vs c2 on the same GPU S -0.0%, M -0.1%, L -0.0% (1,1024 -1.1% is noise); predicted portal 0.6123 +- 0.006 [run_tests]"
  - "tooling: /tmp does NOT persist between probe_b200 calls in this session (/tmp/e1lib.py was absent); send the whole helper each probe. One harness_time(warmup=5, rep=30) call takes ~0.08 s at <= 2048 tokens, so 540 calls fit in ~45 s [probe_b200]"
paths:
  - {max_tokens: 300, lang: cuda, width: 256, threads: 256, rows: 16, grid: oneshot, mem: ldg, x: ef, w: nc, st: el, cluster: 2}
  - {max_tokens: 600, lang: cuda, width: 256, threads: 256, rows: 16, grid: oneshot, mem: ldg, x: ef, w: nc, st: el}
  - {max_tokens: 1100, lang: cuda, width: 256, threads: 256, rows: 48, grid: oneshot, mem: ldg, st: el}
  - {max_tokens: null, lang: cuda, width: 256, threads: 256, rows: 16, grid: oneshot, mem: ldg, st: el}
runs_on:
  H200:
    runs: false
    representative: false
    note: "256-bit LDG/STG are sm_100-only"
  A100:
    runs: true
    representative: false
    note: "128-bit fallback path"
  L40S:
    runs: true
    representative: false
    note: "128-bit fallback path; correctness only"
risks:
  - "Code identical to c2; the only portal risk is run-to-run noise (expected 0.612 +- 0.003)"
  - "The residue curve was measured on the rented B200 (unlocked SM clock); the slope per MB may differ at the portal's 1500 MHz, but the level-off at ~60-90 MB of residue is a cache-capacity property"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
