  - max_tokens: 200
    lang: cuda
    width: 128
    threads: 256
    rows: 128
    grid: persistent
    mem: tma
    launches: 1
    note: "cublasLt forced tile id 183, no workspace"
  - max_tokens: 4095
    lang: cuda
    width: 128
    threads: 256
    rows: 128
    grid: persistent
    mem: tma
    launches: 1
    note: "cuBLAS default via at::matmul_out"
  - max_tokens: null
    lang: cuda
    width: 128
    threads: 256
    rows: 256
    grid: persistent
    mem: tma
    launches: 1
    cluster: 2
    note: "CUTLASS sm100 2-CTA 256x256x64, 6 stages, raster AlongN, TMA store"
runs_on:
  H200:
    runs: false
    representative: false
    note: "sm_100a tcgen05 and 256-bit loads; B200 only"
  A100:
    runs: false
    representative: false
  L40S:
    runs: false
    representative: false
risks:
  - "Large M only at parity with cuBLAS on the rented box; on the portal it could land either side of at::matmul_out by 1-3% (the open part of H6/H12)"
  - "cublasLt tile ids 314/183 come from this cuBLAS build's heuristic list; if missing on the portal, the plan falls back to heuristic index 0 (the default kernel), so no failure"
  - "Adds -lcublasLt to ld_flags; build time ~45 s for the CUTLASS file (parallel with the other two)"
  - "M=25/34/172 gains are 0.4-0.9 us at sizes where portal Tb noise is +-5%"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
