id: r1-splitk4-cluster-m17-64
parents: [r0-skinny16-cublas]
operation: new_design
language: cuda_cpp
niche:
  mem: ldg256
  st: direct
  grid: oneshot
  launch: fused
  tile: rows32
  red: cta
  cache: default
  spec: dispatch:size
hypothesis: >-
  E2/H3: for 17 <= M <= 64, 640 CTAs of 32 B-rows x 512 k (split-K 4 across a 4-CTA cluster), B loaded up front
  into registers with 256-bit loads, A slice staged once per CTA in shared memory, mma.sync with B as the m16
  operand, and a DSMEM cluster reduction should reach the ~7 us read floor. MEASURED: refuted. Every CTA's data
  lands near the end of the stream, so all the mma.sync work (~550 TF/s) runs after the stream ends instead of
  overlapping it. Staging A through L2 costs (5120/BN)*M*4 KB of traffic, and the cluster reduction adds ~1.5 us.
  Result: 10.4-21.1 us vs cuBLAS 7.8-8.6 us. Do not submit to the portal.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: 48
    confidence: high
  L:
    pct: 0
    confidence: high
resources_sm100a:
  regs_per_thread: 96
  smem_per_cta_bytes: 66560
  threads_per_cta: 128
  ctas_per_sm: 5
  bytes_in_flight_per_sm: 141000
  launches_per_call: 1
knobs:
  BN: 32
  SPLIT: 4
  KC: 512
  WARPS: 4
  loads_per_lane: 8
  SPLITK_MAX_M: 64
dispatch:
  - {max_tokens: 16, kernel: skinny_m16_kernel, meta: {BN: 8, WARPS: 8}}
  - {max_tokens: 64, kernel: splitk_kernel, meta: {BN: 32, SPLIT: 4, cluster: 4, threads: 128}}
  - {max_tokens: null, kernel: at::matmul_out (cuBLAS nvjet), meta: {}}
tests: [H3, H4]
findings:
  - "run_tests: 25/25 pass; split-K path M=17 10.4 us vs 7.8 cuBLAS (+33%), 25 11.8 vs 8.5, 32 12.2 vs 7.9, 34 13.5 vs 8.6, 63/64 21.1 vs 8.0 (+165%); predicted portal 0.443 vs 0.487 [run_tests]"
  - "mma.sync m16n8k16 dependent-issue latency on B200 is only 21 cycles, so latency chains are not the problem [probe_b200]"
  - "key mechanism: when every B load is issued up front, data lands at the end for all CTAs, so the whole mma.sync workload (~M*21 MFLOP / 550 TF/s: 0.9 us at M=17, 1.8 at 34, 3.4 at 64) is serialized after the stream; measured compute-stage increments +1.4/+2.0/+5 us match. The same effect explains r0's ~0.6 us above the read floor at M<=16 [probe_b200]"
  - "consequence: any up-front-load design for M>=24 with mma.sync cannot beat cuBLAS (~7.9-8.6 us); the band needs a pipelined stream (compute chunk j while j+1..j+D load) so tensor work overlaps DRAM, plus tcgen05 from M~93 (H4) [INFERRED from probes]"
  - "staging the A slice per CTA via cp.async costs 0.4 us at M=17 and ~2 us at M=34 on top of the B stream (stream+stage-only 7.4/7.7/9.2/11.7 us at M=17/25/34/64): L2->SM traffic (5120/BN)*M*4 KB is as large as B's DRAM traffic at M~32 with BN=32 [probe_b200]"
  - "4-CTA cluster DSMEM reduction (2 cluster barriers + 4 remote float2 reads per output pair) adds ~1.5 us over local-only reduction at M=17-34: above the 1 us refutation threshold [probe_b200]"
  - "8-CTA cluster variant (BN=64, SPLIT=8) cost +3 us for the cluster reduce when CTAs ran in 2 waves [probe_b200]"
  - "dead end: fp32 atomicAdd on shared memory compiles to ATOMS.CAST.SPIN CAS loops on sm_100a (no native shared f32 add); split-K with smem atomics 12.8-105 us [probe_b200]"
  - "occupancy is decisive: 640 one-shot CTAs need 5 CTAs/SM. 256-thread CTAs with 4x32 B per lane can't hold MMA state in 48 regs (launch_bounds(256,5) gives 24-72 B stack spills, +2-8 us); 128-thread CTAs with 8x32 B per lane fit in 90-96 regs without spills. Above ~41 KB smem/CTA (M>40 at KC=512) the grid falls to 2 waves [probe_b200]"
  - "dead end for r0 (M<=16): splitting the mma accumulator chain into 2/4 independent accumulators raises regs to 60/72, gives 4/3 CTAs/SM, and is slower (8.0-9.2 vs 6.9-7.1 us) [probe_b200]"
  - "swapped mma roles (B rows as the m16 operand, A rows as n8) pad M to 8 instead of 16 and keep the r0 k-permutation trick; correct (max err 0.06 vs fp32 ref) [probe_b200]"
paths:
  - {max_tokens: 16, lang: cuda, width: 256, threads: 256, rows: 8, grid: oneshot, mem: ldg, wstat: false, launches: 1, prefetch: false, x: none, w: none, st: none, cluster: 1}
  - {max_tokens: 64, lang: cuda, width: 256, threads: 128, rows: 32, grid: oneshot, mem: ldg, wstat: false, launches: 1, prefetch: false, x: none, w: none, st: none, cluster: 4, note: "split-K 4, A slice via cp.async into smem, DSMEM reduction"}
  - {max_tokens: null, lang: cuda, width: 128, threads: 256, rows: 128, grid: persistent, mem: tma, launches: 1, note: "cuBLAS nvjet via at::matmul_out"}
runs_on:
