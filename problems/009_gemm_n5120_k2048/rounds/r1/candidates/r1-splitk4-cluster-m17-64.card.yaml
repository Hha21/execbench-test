    runs: false
    representative: false
risks:
  - "Slower than cuBLAS at every M it serves (+33% to +165% rented); submitting it would cost about 0.04 of portal score. Kept only as the recorded E2 result."
  - "Cluster launch through the __cluster_dims__ attribute with up to 66.5 KB dynamic smem: 2 waves at M>40"
measure_first: [B200]
compliance:
