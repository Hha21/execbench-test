id: r1b-lt-tiles
parents:
- r1-cutlass256-lt-tiles
- r0-skinny16-cublas
operation: crossover
language: cuda_cpp
niche:
  mem: tma-tensor
  st: bulk
  grid: persistent
  launch: fused
  tile: rows256
  red: cta
  cache: default
  spec: dispatch:size
hypothesis: r0 plus r1's forced cublasLt tiles (tile 314 at M 20-48, tile 183 at M 150-200), without r1's CUTLASS large-M
  path, which was 1-2.5% slower than cuBLAS on the portal. Every path has portal results. Expected portal score ~0.489 from
  the two pages' per-workload times.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: -2
    confidence: medium
  L:
    pct: 0
    confidence: medium
resources_sm100a:
  regs_per_thread: 46
  smem_per_cta_bytes: 214016
  threads_per_cta: 256
  ctas_per_sm: 1
  bytes_in_flight_per_sm: 196608
  launches_per_call: 1
knobs:
  CUTLASS_TILE: 256x256x64
  CLUSTER: 2x1
  STAGES: 6
  RASTER: AlongN
  SWIZZLE: 0
  CUTLASS_MIN_M: 4096
  LT_TILE_M20_48: 314
  LT_TILE_M150_200: 183
dispatch:
- max_tokens: 16
  kernel: skinny_m16_kernel
  meta:
    BN: 8
    WARPS: 8
- max_tokens: 19
  kernel: at::matmul_out (cuBLAS default)
  meta: {}
- max_tokens: 48
  kernel: cublasLtMatmul tile 314
  meta: {}
- max_tokens: 149
  kernel: at::matmul_out (cuBLAS default)
  meta: {}
- max_tokens: 200
  kernel: cublasLtMatmul tile 183
  meta: {}
- max_tokens: null
  kernel: at::matmul_out (cuBLAS default)
  meta: {}
tests:
- H6
- H11
findings:
- 'portal 62881 (r1-cutlass256-lt-tiles): tile 314 -7%/-10% at M=25/34, tile 183 -1% at M=172; CUTLASS +1.1-2.5% slower than
  cuBLAS at M >= 8828 (rented said -1 to -3%) [portal]'
paths:
- max_tokens: 16
  lang: cuda
  width: 256
  threads: 256
  rows: 8
  grid: oneshot
  mem: ldg
  launches: 1
  cluster: 1
- max_tokens: 19
  lang: cuda
  width: 128
  threads: 256
  rows: 128
  grid: persistent
  mem: tma
  launches: 1
  note: cuBLAS default via at::matmul_out
- max_tokens: 48
  lang: cuda
  width: 128
  threads: 256
  rows: 64
  grid: persistent
  mem: tma
  launches: 1
  note: cublasLt forced tile id 314, no workspace
- max_tokens: 149
  lang: cuda
  width: 128
  threads: 256
  rows: 128
  grid: persistent
  mem: tma
  launches: 1
  note: cuBLAS default via at::matmul_out
- max_tokens: 200
  lang: cuda
  width: 128
  threads: 256
  rows: 128
  grid: persistent
  mem: tma
  launches: 1
  note: cublasLt forced tile id 183, no workspace
- max_tokens: null
  lang: cuda
  width: 128
  threads: 256
  rows: 128
  grid: persistent
  mem: tma
  launches: 1
  note: cuBLAS default via at::matmul_out
runs_on:
  H200:
    runs: false
    representative: false
    note: sm_100a tcgen05 and 256-bit loads; B200 only
  A100:
    runs: false
    representative: false
  L40S:
    runs: false
    representative: false
risks:
- Large M only at parity with cuBLAS on the rented box; on the portal it could land either side of at::matmul_out by 1-3%
  (the open part of H6/H12)
- cublasLt tile ids 314/183 come from this cuBLAS build's heuristic list; if missing on the portal, the plan falls back to
  heuristic index 0 (the default kernel), so no failure
- Adds -lcublasLt to ld_flags; build time ~45 s for the CUTLASS file (parallel with the other two)
- M=25/34/172 gains are 0.4-0.9 us at sizes where portal Tb noise is +-5%
measure_first:
- B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
