id: r2-ring-mma
parents:
  - r1b-lt-tiles
  - r1-splitk4-cluster-m17-64
operation: new_design
language: cuda_cpp
niche:
  mem: cpasync
  st: direct
  grid: oneshot
  launch: fused
  tile: rows80
  red: cta
  cache: default
  spec: dispatch:size
hypothesis: >-
  E1/H16: a pipelined cp.async ring (separate B and A rings, 8 chunks of k=64 in flight each, padded 144 B rows
  for conflict-free ldmatrix) feeding mma.sync, with B as the m16 operand, should overlap the tensor work with the
  B stream and reach <= 7.5 us at M=17-64. MEASURED: refuted. The B-only ring reaches 6.85-7.2 us. Adding the A
  ring makes it 7.7/8.1/8.9 us at M=17/32/64 with no MMA at all, which is already at or above cuBLAS (7.8-8.0).
  The real MMA loop and the split-K epilogue add a further 6-10 us: 13.9-18.8 us in harness timing. MAXM by the
  4% rule = 0. The ring path is enabled for M=17-64 only to record the result; do not submit.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: 57
    confidence: high
  L:
    pct: 0
    confidence: high
