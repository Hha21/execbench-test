risks:
  - "Slower than cuBLAS by 76-137% at M=17-64 on the rented B200; submitting it would cost ~0.06 of portal score. Kept only as the E1 record; production should stay on r1b-lt-tiles."
  - "Split-K scratch and counters are static __device__ arrays (zeroed at module load, counter reset each call); correct only for single-stream use, which the harness guarantees."
