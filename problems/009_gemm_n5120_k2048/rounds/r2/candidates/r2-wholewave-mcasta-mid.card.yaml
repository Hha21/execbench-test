hypothesis: >-
  E3 exploration (H15, H17). r1b-lt-tiles plus whole-wave CUTLASS sm100 1-SM tiles for M=200-1500, with A
  TMA-multicast along an N-cluster to cut the bytes each SM issues. Result: refuted. Whole-wave tiles are 17-62%
  slower than cuBLAS at M=289/492/952, whatever the BK (64/128) or multicast (1x1/1x2/1x4). Single-wave CUTLASS
  tiles fit t = bytes received per SM / ~90 GB/s + 1.5 us to within 1 us. The SM-side bound is the bytes each SM
  receives, and multicast does not reduce them. Only cuBLAS's 2-CTA tiles, which split B across an SM pair, get
  under it. This candidate is a recorded negative result; do not spend a portal slot on it.
