id: r1-oproj-e1-baseline-id
parents: [r0-oproj-cublaslt-fused-v0]
operation: new_design
language: cuda_cpp
niche:
  mem: tma-tensor
  st: direct
  grid: persistent
  launch: fused
  tile: rows128
  red: cta
  cache: default
  spec: all
hypothesis: >-
  E1 (tests H11): the code is r0, unchanged. The session timed PyTorch-only candidates under harness CUPTI timing on the
  rented B200. No candidate that includes the residual add reaches Tb. Tb divided by a plain cuBLAS matmul alone (no add)
  is flat at 1.18-1.26 (spread 7%) over all 10 sizes. So Tb behaves like plain-GEMM speed times about 1.22, which is
  the portal/rented factor for plain cuBLAS GEMMs. To beat Tb, a kernel must fuse the residual at plain-GEMM speed (H10).
expected_effect:
  S: {pct: 0, confidence: high}
  M: {pct: 0, confidence: high}
  L: {pct: 0, confidence: high}
resources_sm100a:
  regs_per_thread: 0
  smem_per_cta_bytes: 0
  threads_per_cta: 0
  ctas_per_sm: 0
  bytes_in_flight_per_sm: 0
  launches_per_call: 1
knobs: {workspace_mb: 32, algo: heuristic-0, alpha: 1, beta: 1}
tests: [H11, H9, H10]
findings:
  - "H11 PARTLY SUPPORTED, but not by any whole PyTorch candidate. Tb / plain-matmul-only rented time (nvjet GEMM, no add), M=256,512,586,1024,1571,2048,4096,4106,7976,8192: 1.20, 1.20, 1.19, 1.25, 1.18, 1.26, 1.24, 1.23, 1.22, 1.23 (spread 7%, mean 1.22). Matmul-only rented times: 8.3, 10.0, 11.8, 12.7, 18.6, 20.7, 35.6, 35.7, 70.0, 70.1 us [probe_b200]"
  - "Eager matmul+add rented us: 12.3, 14.5, 17.1, 17.9, 25.5, 28.3, 48.1, 48.4, 90.1, 90.7. Tb/t = 0.81, 0.83, 0.82, 0.88, 0.86, 0.92, 0.92, 0.91, 0.95, 0.95: not flat (spread 17%), rising with M, since the add is a fixed fraction of 12-25%. Refutation criterion met for eager [probe_b200]"
  - "torch.addmm(r, a, W.t(), out=) rented us: 11.9, 15.7, 21.5, 18.4, 31.0, 29.2, 48.3, 52.5, 89.2, 89.0. Tb/t = 0.83, 0.76, 0.65, 0.86, 0.71, 0.89, 0.92, 0.84, 0.96, 0.97 (spread 33%, noisy, worse than eager at 586/1571/4106) [probe_b200]"
  - "torch.compile default (dynamic shapes): 12.3, 15.7, 21.7, 18.5, 30.9, 29.4, 48.4, 52.4, 89.1, 89.2 us. Tb/t = 0.81-0.96. Identical to addmm: Inductor lowers matmul+add to aten addmm (the badd nvjet variant), no Triton fusion [probe_b200]"
  - "max-autotune-no-cudagraphs at M=256 and 8192: 12.0 and 89.3 us. Inductor's autotune table ranks aten addmm first. The best Triton template mm is 1.4x slower at 8192 (0.125 vs 0.089 ms, BLOCK 128x128x64). So the compiled result is the same addmm kernel as eager [probe_b200]"
  - "max-autotune with cudagraphs, timed under harness_time: 31.6, 39.4, 50.5, 163.4 us at M=256, 1024, 2048, 8192. Tb/t = 0.31-0.53. The graph wrapper adds input-copy kernels inside the timed window, so this cannot be Tb. Not a candidate [probe_b200]"
  - "F.linear(a,W) + copy: 11.8-83.9 us, Tb/t 0.73-1.03 (noisy). baddbmm: same as addmm. add alone: 3.0 us (256) .. 23.0 us (8192), Tb/t 3.2-3.8 [probe_b200]"
  - "Candidate (f) Inductor CUTLASS backend was not timed (session budget). Inductor's own autotune already prefers aten addmm over Triton templates, so a CUTLASS template is unlikely to be flat at 1.22 either [inferred]"
  - "Kernel names could not be read: torch.profiler returns no CUDA activities inside the probe because CUPTI is held by the harness. From the earlier session notes the reference and addmm/compile paths run an nvjet GEMM plus a separate elementwise add, or a DtoD copy plus the badd nvjet variant. Count = 2 per call [probe_b200]"
  - "Clock lock failed: nvidia-smi -lgc 1500,1500 gives 'The current user does not have permission to change clocks'; -lmc says use --lock-memory-clocks-deferred (not tried, root needed). The rented GPU idled at 975 MHz and ran 1965 MHz under load. H9 stays open and the locked-clock re-time of r0 was not done [probe_b200]"
  - "Indirect H9 evidence: r0 portal/rented is 1.22 (S), 1.32 (M), 1.37 (L). Plain-GEMM Tb/rented-matmul is a flat 1.22. So plain cuBLAS GEMMs lose about 22% at the lock at every size, but the fused C!=D call loses 32-37% at M/L. The extra 10-15% at M/L is specific to the fused kernel. Possible causes: a different algorithm at the lock, or the residual read not hidden [inferred from portal and probe_b200]"
  - "Consequence for strategy: Tb is about the plain-GEMM time (no separate add). The reference's add costs 12-25%. The portal score is (Tb-Tsol)/((t-Tsol)+(Tb-Tsol)). A fused GEMM that matches the plain cuBLAS GEMM time with the add free would give t about Tb and a score of about 0.5 at S/M, versus 0.36-0.48 today. H10 (a fused kernel at plain-GEMM speed) is the main lever [inferred]"
  - "r0 re-run on the rented B200: 16/16 pass, 8.7 (256) .. 76.1 us (8192), within 0.5% of the archive r0 [run_tests]"
paths:
