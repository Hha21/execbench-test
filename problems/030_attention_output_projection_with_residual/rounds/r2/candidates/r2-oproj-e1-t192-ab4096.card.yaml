risks:
  - "Expected to score below the parent (emulator 0.444 vs 0.453): 3 of the 4 workloads at 4096 tokens run a kernel that is 4-7% slower on the rented box. Only worth a portal slot if the portal ratio of CUTLASS-fused to cublasLt-fused at M (H17) is wanted; otherwise keep the parent"
  - "OPERATOR: the bf16 type name is token-pasted, as in the parent (lint whitelist needed). The A/B dispatch on (batch, seq) depends on shape only; every variant is correct (16/16) and launches one kernel"
  - "three CUTLASS instantiations in one .cu file make the build longer (run_tests took 91 s in total, including the build)"
