lineages:
- id: A
  thesis: Phase-separated pipeline of plain launches (bulk/TMA-staged dwconv+LN, cuBLASLt FP16 GEMMs, lean one-round elementwise
    kernels, fp16 materialised hidden) that wins by per-phase efficiency; the control lineage and carrier of conv/epilogue
    techniques.
  status: active
  started: r1
  best: r5-a-e2-ringk2
  conclusions:
  - Carries 9 of 16 rows in r6-merge (all C<=320 rows except 1,96 / 1,192 / 8,384 / 16,384); no experiment in r7 because its
    unbuilt levers (K2 removal, K4 removal, one-launch GRN) are now F's launch-count thesis or need a fused tensor-core epilogue
    (lineage G).
  - 'Each custom launch is a 2-3 dependent-round chain and the portal charges A''s 5-6 launches at 1.40-1.55x rented on S/M
    rows (single-launch coop 1.20-1.32x): launch count is a first-order axis on S/M rows.'
  - K2 is NOT stream-bound (59 % of copy rate at 64,96); the remaining ~100 us is FMA/INT issue of the exact erf (not MUFU),
    so only a GEMM-epilogue GELU removes it; at 64,96 the chain K1 315 + G1 191 + K2 319 = 825 us rented is 2.5-3x the conv+GELU
    SIMT bound.
  - cuBLASLt FP16 is 1.4-2.1x faster than TF32 everywhere; the library GELU epilogue is the tanh approximation (rejected on
    precision, F r6); swap-AB batched NCHW GEMM2 is fine at HW >= 784 and 20-190 us slower at HW = 49/196.
  - 'Precision log delivered for all 16 shipped paths (0 beyond-own-atol over 10 seeded rounds, max 2.427e-3 vs atol 2.7e-3
    at 1,96). Cross-host rented drift is 5-12 us on unchanged rows: every pick needs an interleaved same-container control.'
- id: B
  thesis: One cooperative launch with every phase fused (FP16 mma.sync, fp16 hidden in L2), aiming at S rows <= 24 us rented
    by cutting the per-phase chain between the two grid barriers.
  status: paused
  started: r1
  best: r3-coop-flat-bulkrows
  conclusions:
  - Single-launch coop beats A's launch pipeline at 1,192 and 1,96 on the portal (38.1 / 35.5 us) even where A looked 5-8
    % faster rented, because its portal ratio is 1.25-1.31 against A's 1.40-1.55 there.
  - 'H27 refuted (r4): per-tile counters release in 0.64 us but the dataflow kernel was 1.4-2x slower on every S row (per-tile
    weight re-conversion, static lists); any dataflow must keep a one-pass weight conversion and claim tiles dynamically.'
  - 'Barrier microbench (r4): a flat atomic-counter barrier releases in 0.86-1.07 us vs 1.6-1.9 us for the cg flip barrier;
    a two-level tree is worse (3.9 us). Unbuilt knob: swap the two grid.syncs for the flat counter (about -1.5 us per S row).'
  - 'Floor with two barriers is 10-13 us, so 15-18 us of SM work and conv-tail wait remain at 1,192 (29.5 us); the mma.sync
    engine and the conv lose every row with B >= 2 or C >= 384. r7: D''s tcgen05 skeleton is tried on the same rows (E2);
    B resumes only if E2 fails.'
  - Pitfalls: runtime guards around mma.sync cost ~470 clk per k-block; register-direct erff epilogues take 16 us per tile;
      a release arrive with loads in flight stalls. Precision log for B's shipped paths (1,192, 1,96) still owed (operator
      action).
- id: C
  thesis: On-chip hidden with no global intermediates (hidden tile in shared memory across one grid barrier, weight slices
    ingested from L2, GEMM2 split-K reduced with red.add into a prefilled output).
  status: retired
  started: r1
  best: r2-e3-onchip-hidden-v2
  conclusions:
  - 'Retired r3: H13 (16-CTA clusters, DSMEM ~12 B/clk/SM) and H20 (one-barrier on-chip hidden, 30.8 us at 1,192 vs 25 kill)
    refuted; no edge over a materialised fp16 hidden.'
  - Keep: one-shot cp.async.bulk into smem after the flush runs at ~120 GB/s/SM; converting inside the ring is 2-2.5x slower,
      so keep slices fp32-resident and cvt.rn.f16x2 at fragment load.
  - Keep: TFLOAT32 TMA maps round to nearest even bit-exactly (H14); red.global.add.f32 into L2 reaches 4.1-4.4 TB/s from
      256-512 CTAs.
  - Keep: cold __ldg of small vectors at the point of use adds a DRAM round each; bulk-load them at entry.
  - Conv redundancy 4C/BN (2-6x) and per-CTA serial rounds dominated, not bytes; pool I17/I21 (tcgen05 all-N token tiles)
    stay in the pool, superseded for r7 by E2 (D's engine with a materialised hidden on the same rows).
- id: D
  thesis: Cooperative single-launch specialist (bulk-plane conv, CTA-local or per-tile GRN statistics, split-K GEMM2 with
    coalesced red.add) whose GEMM engine is hand-written tcgen05 kind::f16 in the swap-AB orientation (weights as M, tokens
    as N), so the output tile is NCHW and the stats are thread-local; first the six wide-C small-image rows, from r7 also
    the C<=192 rows and 1,160.
  status: active
  started: r3
  best: r6-d-e2-epi-fix
  conclusions:
  - 'r6 epilogue fix (hreg[4][16] lived in a 128-B local stack frame; compile_b200''s ''local 0'' counts spills only) plus
    staged coalesced h/g stores: 2,768 27.6 / 8,768 34.6 / 16,768 46.5 / 32,768 66.6 / 8,384 38.0 / 16,384 58.5 us rented,
    16/16 pass, precision 59-67 % of atol; wins five rows in r6-merge at portal ratio 1.20-1.32 (32,768 ties A and stays on
    A).'
  - 'H31/H33 probe: the per-SM operand cap is SM-side (68-92 B/clk/SM landing; B multicast changes nothing); a cta_group::2
    pair (half the per-SM B bytes) reaches the MMA ideal at N >= 224 (345 / 455 / 518 clk vs 256 / 448 / 512 at N = 128 /
    224 / 256) and the recipe (cta_group::2 alloc, shared::cluster TMA to the leader''s barrier, idesc M = 256, multicast
    commit mask 3) worked first try. Unported to GEMM1/GEMM2.'
  - 'Validated and reusable: MN-major SW128 B descriptor (LBO 8192, SBO 1024, +2048 per k16), instruction descriptor bits,
    2-accumulator GEMM2 (h and g = gw*gf*h) that avoids a B transform, target_hardware [B200] only for tcgen05, globaltimer
    stamps only from the warp that does the work.'
  - 'Remaining wide-C terms: 16,384 / 32,768 tile tails (192 / 264 GEMM1 tiles on 148 CTAs, 12 us at 16,384), phase A 10-16
    us (uneven 32-plane conv units, 19 MB weight pass), GEMM2 wait 3.7-8 us. These are r8 levers (pair port, N-chunked 14x14
    tiles, balanced conv units).'
  - 'Phase A at 2,768 is 7.4 us of a 27.6 us row with only 0.46 GFLOP of GEMM1: the small-C rows (1.2 MB of weights, 0.6 MB
    of x) should cost less than 2,768 in the same skeleton, which is E2''s bet (H34).'
- id: E
  thesis: Library tcgen05 with fused epilogues (CUTLASS 4.4 sm100 builder GEMMs whose EVT epilogues carry the LN fold, exact
    erf GELU, hidden store and per-image GRN sum of squares; TF32 operands straight from fp32 memory where the MMA is cheap).
  status: paused
  started: r5
  best: null
  conclusions:
  - 'H30 refuted as specified (r5): per-image batching re-reads W1 once per image and TF32 doubles the bytes, so G1 with the
    full EVT is 17.0 us at 8,768 and 20.0 at 8,384; the pipeline beat A r4 only at 2,768.'
  - 'EVT nodes that instantiate on sm100 TmaWarpSpecialized1Sm: Sm90ColBroadcast (batch stride), Sm90RowBroadcast, Sm90Compute<multiply_add>,
    Sm90Compute<GELU> (erf form), Sm90RowReduction with FinalReduction=false; the erf GELU costs +2.4-8.5 us because the epilogue
    does not overlap a one-tile-per-CTA mainloop.'
  - CUTLASS tfloat32_t on fp32 memory rounds to nearest (H14); split-K as the batch mode works on sm100; three .cu files build
    in 26-50 s wall.
  - Unresolved: run_tests 14/16 twice from CUPTI sequence-matching errors on changing rows; this path must not go to the portal
      until the cause is known.
- id: F
  thesis: Library-lean four-launch pipeline for the HW<=784 rows (LayerNorm finished inside the conv launch via a cluster-of-8
    DSMEM statistics exchange, cuBLASLt FP16 GEMM1, a one-launch GRN statistics-and-scale kernel with per-image counters,
    cuBLASLt swap-AB batched GEMM2 writing NCHW) that wins by launch count.
  status: paused
  started: r6
  best: r6-f-e1-libpipe
  conclusions:
  - 'H32 refuted (r6): vs r5-merge-b in one container 8,768 -3.2, 8,384 -2.2, 16,768 -1.0, 2,768 +1.0, 32,768 +2.4, 16,384
    +4.5 us; D r6 then beat F by 4-10 us on every wide-C row. Paused r7 (incubation forbids retiring): its S-row value (1,192
    26.6 rented with 4 launches vs B 30.8 single launch) is a toss-up at the per-structure portal ratios and is E2''s target;
    resume if E2 fails.'
  - 'cuBLASLt''s GELU epilogue is the tanh form (max 4.7e-4 from erf): 11 beyond-atol elements at 1,192 with fp16 b1, max
    2.43-2.46e-3 with fp32 b1. Rejected on precision; the exact erf must run outside the library. Folding gb into the fp16
    hidden also fails (keep gb in b2'' = W2.gb + b2).'
  - 'One-launch GRN kernel (K3) works with a plain launch when grid <= residency: 64-bit red.add (count in bits 52..63, fixed-point
    sum of gf), ld.relaxed poll, departure counter resetting the cell; 7-20 us, floor 5-7 us plus 2.6 us per million hidden
    elements; fp32 z doubles its load bytes but fp16 z costs precision.'
  - K1: cluster-of-8 LN exchange costs 0.4-2.4 us; L2 weight prefetch at entry had no measurable effect (pool I26 at this
      position is dead); conv and weight conversion serialise inside a CTA (keep role-only CTAs).
  - Precision log delivered for all 9 F paths (0 beyond atol, 59-76 % of atol).
- id: G
  thesis: 'Fused pass-1 persistent kernel for the HW >= 1024 rows (64,96; 32,128; 8,320; 4,96): CUDA-core warps stage x through
    a TMA box ring, run the 7x7 conv and LN statistics and write the fp16 d tile straight into shared memory as the tcgen05
    kind::f16 B operand (swap-AB, W1'' as A), epilogue warps apply the LN fold, an exact erf GELU balanced between the FMA
    and MUFU pipes, per-(image,k) sumsq and the fp16 hidden store; a GRN scale launch (per-image fp16 W2_b, b2'') and a batched
    swap-AB GEMM2 writing NCHW finish the row. Conv, GELU, MMA and DRAM traffic overlap inside one kernel instead of three
    passes.'
  status: active
  started: r7
  best: null
  conclusions:
  - Seeded r7 from pool family I11/I19 (plus I30 balanced erf and I24/I28 conv producers), the unbuilt family with the largest
    absolute headroom (64,96 at 1282 us portal vs a 70 us Tsol; 32,128 at 322 vs 20).
