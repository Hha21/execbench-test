lineages:
- id: A
  thesis: Phase-separated pipeline of plain launches (bulk/TMA-staged dwconv+LN, cuBLASLt FP16 GEMMs, elementwise steps as
    lean one-round kernels, fp16 materialised hidden) that wins by per-phase efficiency; the control lineage and carrier of
    conv/epilogue techniques.
  status: active
  started: r1
  best: r4-a-e1-bulkplane-wprep
  conclusions:
  - Bulk-plane conv in K1 (r4) cut K1 from 18-33 us to 10-17 us on the W=7/14/449x7 rows (5 rows gained 12-24 us rented);
    the conv itself is 4-9 us at C=768 and the fp32->fp16 weight pass (8.9-11 us, W2 rows one warp with 4 serial rounds) now
    bounds K1 at C=768 with B<=8.
  - Each custom launch costs 6-17 us at S because it is a 2-3 dependent-round chain; K2 (447 us at 64,96 for 616 MB, 113 at
    32,128, 38 at 8,320) and K3 (6-17 us, 3-round chain) are the levers left on this path; a tcgen05/library epilogue would
    remove them outright (lineage E tests that).
  - cuBLASLt FP16 is 1.4-2.1x faster than TF32 everywhere; at C=768 GEMM1+GEMM2 cost 15.6-24 us cold against a 2.7 us weight
    stream; NCHW strided-batched GEMM2 is slow in cuBLASLt (K4 transpose-add instead).
  - Portal/rented ratio for this lineage is 1.16-1.22 on the small multi-launch rows and 1.23-1.32 elsewhere; cross-run drift
    of 5-12 us on unchanged rows means every pick needs an interleaved same-container control.
  - Precision max |err| 2.37-2.39e-3 against atol 2.4e-3 on three rows; the 10-seeded-round log is still owed (hard deliverable
    of E2 r5).
- id: B
  thesis: One cooperative launch with every phase fused (FP16 mma.sync, fp16 hidden in L2), aiming at S rows <= 24 us rented
    by cutting the per-phase chain between the two grid barriers.
  status: paused
  started: r1
  best: r2-coop-flat-s
  conclusions:
  - Coop beats three plain launches by 3-7 us at S (F 4.6 vs 9.9 us); mma.sync f16 is enough on every S row; still the merge's
    best at 1,192 / 1,96 / 2,96.
  - 'H27 refuted (r4): per-tile counters release in 0.64 us but the dataflow kernel was 1.4-2x slower on every S row because
    each tile re-converted its weight slice and the static lists serialised conv -> GEMM1 -> GEMM2 on the first CTAs; a dataflow
    design must keep the one-pass weight conversion and claim tiles dynamically.'
  - 'Barrier microbench (r4): a flat atomic-counter barrier releases in 0.86-1.07 us median vs 1.6-1.9 us for the cg flip
    barrier; a two-level tree is worse (3.9 us). Cheap knob for r6: swap the two grid.syncs for the flat counter barrier (about
    -1.5 us per S row).'
  - Floor with two barriers is 10-13 us (F 4.6 + 2 x 1 us releases + one cold round + two just-written rounds), so 15-18 us
    of SM work and conv-tail wait remain at 1,192 (29.5 us); three rounds of load-path changes did not move it.
  - 'Pitfalls: runtime guards around mma.sync cost ~470 clk per k-block; register-direct erff epilogues take 16 us per tile;
    a release arrive with loads in flight stalls; decide dispatch from run_tests with a same-build control, never from a ctypes
    probe harness.'
- id: C
  thesis: On-chip hidden with no global intermediates (hidden tile in shared memory across one grid barrier, weight slices
    ingested from L2, GEMM2 split-K reduced with red.add into a prefilled output).
  status: retired
  started: r1
  best: r2-e3-onchip-hidden-v2
  conclusions:
  - 'Retired r3: H13 (16-CTA clusters, DSMEM ~12 B/clk/SM) and H20 (one-barrier on-chip hidden, 30.8 us at 1,192 vs 25 kill)
    refuted; no edge over a materialised fp16 hidden and no plan for 8,192 / C>=320.'
  - 'Keep: one-shot cp.async.bulk into smem after the flush runs at ~120 GB/s/SM; converting inside the ring is 2-2.5x slower,
    so keep slices fp32-resident and cvt.rn.f16x2 at fragment load.'
  - 'Keep: TFLOAT32 TMA maps round to nearest even bit-exactly (H14); red.global.add.f32 into L2 reaches 4.1-4.4 TB/s from
    256-512 CTAs.'
  - 'Keep: cold __ldg of small vectors at the point of use adds a DRAM round each; bulk-load them at entry.'
  - Conv redundancy 4C/BN (2-6x) and per-CTA serial rounds dominated, not bytes.
- id: D
  thesis: Cooperative wide-C specialist for the six C>=384, HW<=196 rows (bulk-plane conv, CTA-local GRN statistics, split-K
    GEMM2 with coalesced red.add) whose GEMM engine is hand-written tcgen05 kind::f16 in the swap-AB orientation (weights
    as M, tokens as N), so the output tile is NCHW and the stats are thread-local.
  status: active
  started: r3
  best: r4-d-tc05-swapab
  conclusions:
  - 'r4 tcgen05 swap-AB build passes 16/16 (168 regs, 227.5 KB smem, 148 CTAs x 384 thr): 2,768 32.4 / 8,768 49.1 / 16,768
    70.8 / 32,768 99.3 / 8,384 79.8 / 16,384 111.7 us rented; wins only 2,768 against A r4 (48.5 / 44.4 / 53.2 / 70.1 / 50.4
    / 71.5). H28 targets missed 0 of 6.'
  - 'Validated and reusable: MN-major SW128 B descriptor (LBO 8192, SBO 1024, +2048 per k16), instruction descriptor bits,
    2-accumulator GEMM2 (h and g = gw*gf*h) that avoids a B transform; target_hardware must be [B200] only for tcgen05.'
  - 'Mainloop is bound by L2->SM operand ingest at ~55-72 B/clk/SM (same ~135 GB/s/SM as the bulk ring): per 64-k stage 524-683
    clk vs a 224-448 ideal, unchanged by stage depth, so neither latency nor an ELECT waterfall. Fix candidates: cta_group::2
    pairs (halve per-SM B ingest) or TMA multicast of B across hidden tiles.'
  - '32,768 (99 us) and the 14x14 rows (80/112 us) sit ~2x above a bytes-and-ingest estimate of 40-50 us: undiagnosed (no
    stamps). Suspects: GEMM1 epilogue issue rate (~35-40 instr/element on 8 warps), doubled GEMM2 B ingest from g, scalar
    red volume, 2 tiles per CTA. r6 step: globaltimer stamps first, then the biggest term.'
  - Bulk-plane conv 1.5-10 us; coalesced red.global.add.v4 2.4-4.2 us for 2.4-9.6 MB; latency-bound smem loops with runtime
    trip counts cost 5-17 us each (use compile-time counts with all loads issued first).
- id: E
  thesis: 'Library tcgen05 with fused epilogues: CUTLASS 4.4 sm100 builder GEMMs whose EVT epilogues carry the LN fold, exact
    erf GELU, hidden store and per-image GRN sum of squares (GEMM1) and the residual plus NCHW store (batched split-K GEMM2),
    fed TF32 operands straight from fp32 memory through TMA where the MMA is cheap (no weight conversion) and fp16 where it
    is not, with a one-round GRN scale kernel between them.'
  status: active
  started: r5
  best: null
  conclusions:
  - Seeded r5 from the unbuilt library-fusion family (pool I6/I8/I16 plus the zero-conversion TF32 idea I2/I20); aimed at
    the six wide-C small-image rows first, HW=784 rows next.
