lineages:
- id: A
  thesis: Phase-separated pipeline of plain launches (TMA-staged dwconv+LN, tensor-core GEMMs with every elementwise step
    fused into their epilogues, fp16 materialised hidden) that wins by per-phase efficiency; the control lineage and the carrier
    of conv/epilogue techniques.
  status: active
  started: r1
  best: r2-lib-cublaslt-fp16-tmaconv
  conclusions:
  - Each custom launch costs 6-17 us at S (2-3 dependent rounds plus ramp), so the 5-6 launch pipeline floors at 35-40 us;
    the lever is fusing K2/K3/K4 into GEMM epilogues (3 launches), not faster library calls at C<=192.
  - 'TMA 3-D box staging (box starts at w=-4, inner coordinate a multiple of 16 B or the copy faults) lifted conv ingest 11x:
    K1 5.6 us at 1,192, 315 us at the largest (still 3x the FMA bound, LDS/sync-bound at ~40% FMA busy). W=7/14 rows still
    use the 8 GB/s/SM staging.'
  - 'cuBLASLt FP16 is 1.4-2.1x faster than TF32 at every shape, but at C=768 GEMM1+GEMM2 cost 15.6-24 us cold against a 2.7
    us weight stream: the library is a first-order term on the four C=768 rows (audit r3), not at 1,192.'
  - 'H16: a materialised fp16 hidden is cheap under the dirty-L2 flush below 42 MB (3.6 us over the floor at 20 MB) and ~1.4x
    ideal at 134 MB.'
  - 'Precision: single-pass FP16 max |err| 2.37-2.39e-3 at 32,128 / 8,768 / 32,768 against atol 2.4e-3 (0 beyond on 1-3 rounds);
    the hi/lo split of the cheap operand is the fallback per row.'
- id: B
  thesis: One cooperative launch with every phase fused, FP16 mma.sync, fp16 hidden materialised in L2 between grid syncs;
    the fixed-cost specialist aiming at S rows <= 20 us rented by making every post-sync operand one bulk copy and prefetching
    everything phase-independent at entry.
  status: active
  started: r1
  best: r2-coop-flat-s
  conclusions:
  - Coop beats three plain launches by 3-7 us at S (F 4.6 vs 9.9 us); mma.sync f16 = 0.455 PF/s, enough everywhere except
    8,320 / 32,768 / 32,128 / 64,96.
  - 'Flattening every phase to one load round did not move 1,192 (30.5 vs 30.4): ~12 dependent steps of 1.5-2.5 us remain,
    and a 12-32 KB cp.async round right after a grid sync costs 2-4 us. Whether that is issue rate (4-B copies, div/mod) or
    post-barrier L2 latency is NOT isolated (H24, E2).'
  - Coalesced conv CTA unit (32 ch x 8 four-column positions, lanes along w) is 2x faster than lane-per-channel patches; 8-channel
    tiles matter at S (tile count, not FMA rate).
  - 'Pitfalls: runtime guards or ''#pragma unroll 2'' around mma.sync cost ~470 clk per k-block (per-shape templates, all
    fragment LDS first, shfl-uniform warp index); a register-direct 48-erff epilogue took 16 us per tile, an smem-staged 8-column
    rolled loop with 16-B stores fixed it; a release arrive with loads in flight stalls.'
  - Weight pass costs ~10 us of P1 at C=768 and 2-3 us at C<=192; split-K is worth 28% at C=768 and nothing at 1,192.
- id: C
  thesis: On-chip hidden with no global intermediates (hidden tile in shared memory across one grid barrier, weight slices
    ingested from L2, GEMM2 split-K reduced with red.add into a prefilled output); clusters/DSMEM in r1, bulk rings in r2.
  status: retired
  started: r1
  best: r2-e3-onchip-hidden-v2
  conclusions:
  - 'Retired r3: H13 (16-CTA clusters, DSMEM ~12 B/clk/SM) and H20 (one-barrier on-chip hidden, 30.8 us at 1,192 vs 25 kill)
    both refuted; 0.4175 projected, ties B on its best rows and has no plan for 8,192 / C>=320 (smem).'
  - 'Keep: one-shot cp.async.bulk into smem after the flush runs at ~120 GB/s/SM (590 KB in 5.0 us, ~16 TB/s aggregate from
    L2); converting inside the ring is 2-2.5x slower, so keep slices fp32-resident and cvt.rn.f16x2 at fragment load.'
  - 'Keep: TFLOAT32 TMA maps round to nearest even bit-exactly (H14); red.global.add.f32 into L2 reaches 4.1-4.4 TB/s from
    256-512 CTAs (1.0 TB/s from 32).'
  - 'Keep: cold __ldg of small vectors at the point of use adds a DRAM round each; bulk-load them at entry (37.2 -> 30.8 us
    at 1,192). Zero-padded plane fills need all loads issued before the stores.'
  - Conv redundancy 4C/BN (2-6x) and per-CTA serial rounds dominated, not bytes; the on-chip hidden gives no edge over a materialised
    fp16 hidden.
- id: D
  thesis: Weight-stationary cooperative kernel for the six wide-C small-image rows (C>=384, HW<=196) where each CTA owns a
    hidden slice and whole-image token tiles, ingests its fp32 W1/W2 slices once per call through TMA/bulk rings with no conversion
    pass, keeps GRN statistics CTA-local, and reduces GEMM2 through red.add or a materialised scaled hidden chosen per row.
  status: active
  started: r3
  best: null
  conclusions:
  - 'Seeded from pool families I22/I25 (+I26 bulk-plane conv, I15 entry prefetch): the six target rows hold 0.056 of mean
    against the leader; the leader''s implied rented times are 27/34/46/67 us at 2/8/16/32,768 and 37/52 at 8/16,384.'
