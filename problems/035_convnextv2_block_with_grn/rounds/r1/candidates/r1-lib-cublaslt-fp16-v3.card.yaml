id: r1-lib-cublaslt-fp16-v3
parents: [r0-convnext-coop-fp32-anchor]
operation: new_design
language: cuda_cpp
niche:
  mem: cpasync
  st: direct
  grid: oneshot
  launch: split
  tile: rows2
  red: warp
  cache: default
  spec: all
hypothesis: >-
  Lineage A / E1 (H15, H16). A phase-separated library pipeline needs no tcgen05 code: custom depthwise conv, cuBLASLt
  fp16 GEMMs, custom GELU/GRN. LayerNorm is folded away (W1' = W1*lnw, with u[k] and cst[k] computed on the side) so the
  conv needs no per-token all-channel tile. 5 launches (6 on small images) should land S rows at 25-35 us.
  Result: 16/16 pass, run_tests projects 0.594 (anchor 0.304), but S rows are 35-55 us and 7x7 rows 57-89 us. cuBLASLt
  and the fp16 hidden round trip are cheap; each custom launch costs 6-17 us, not 2 us.
expected_effect:
  S: {pct: -54, confidence: high}
  M: {pct: -68, confidence: high}
  L: {pct: -82, confidence: high}
resources_sm100a:
  regs_per_thread: 80
  smem_per_cta_bytes: 28000
  threads_per_cta: 32
  ctas_per_sm: 8
  bytes_in_flight_per_sm: 24000
  launches_per_call: 5
knobs: {WT: "16/14/7 by W", NWc: "1 small, 3-6 large", RT: "tallest tile with >=150 CTAs", NC: 4, tokb: "<=192 token blocks per image", branch_B_threshold_MB: 16, useCL: "HW%8!=0 or HW<256"}
dispatch:
  - {max_tokens: null, kernel: k1_dw+cublasLt+k2_gelu+k3a_w2|k3b_scale+cublasLt(+k4_transpose_add), meta: {per-shape plan keyed on (B,C,H,W)}}
tests: [H15, H16]
findings:
  - "run_tests (rented B200, 16/16 pass, final v3), us: 1,192,28,28 34.5; 1,96,56,56 39.1; 1,160,449,7 47.7; 2,96,56,56 50.0; 4,192,28,28 53.6; 8,384,14,14 70.1; 4,96,56,56 56.5; 8,192,28,28 65.5; 16,384,14,14 84.5; 2,768,7,7 58.9; 8,768,7,7 57.2; 16,768,7,7 70.3; 8,320,32,32 130.4; 32,768,7,7 89.3; 32,128,64,64 445.4; 64,96,112,112 1789.9 (anchor 88.6/62.8/110.7/97.5/139.3/272.7/141.6/216.4/351.8/123.9/261.7/587.4/622.9/1214/1658/5584). Projected portal 0.5937 +-0.008 [run_tests]"
  - "history of this lineage: v1 (LN-fused conv, 128-thread warps looping channel chunks) 0.455 projected; v2 (conv without LN, 32-channel warp chunks, LN folded into W1/K2, channels-last GEMM2 + transpose) 0.566; v3 (1-warp CTAs + tall tiles for small shapes, 4 sumsq copies, K3a prefetch) 0.594 [run_tests]"
  - "success criteria vs result: S/M rows <= 40 us met only at 1,192 (34.5) and 1,96 (39.1); 8/16/32,768,7,7 <= 80 us met at 8 (57.2) and 16 (70.3), missed at 32 (89.3); largest <= 700 us missed (1790); projected 0.594 < 0.60 target. Refutation tests: cuBLASLt GEMM1+GEMM2 <= 12 us at 1,192 (5.1+6.8), so the library floor is NOT the limit; H16 round trip <= 4 us at 20 MB, so NOT refuted [probe_b200]"
  - "per-launch cumulative cold-L2 breakdown, us (K1 conv+weight prep / GEMM1 / K2 GELU+stats / K3 GRN scale / GEMM2 / K4 transpose): 1,192,28,28 12.8/5.1/9.8/6.2/6.8/- = 40.6; 1,96,56,56 16.4/5.0/10.5/6.6/6.9/- = 45.4; 2,768,7,7 18.6/6.0/8.4/17.3/9.6/4.1 = 64.1; 8,384,14,14 28.4/7.0/14.3/11.8/10.2/5.2 = 77; 32,768,7,7 33.5/10.1/19.0/10.8/13.8/8.2 = 95.3; 8,320,32,32 61.4/11.0/37.8/11.0/14.2/- = 135.4; 32,128,64,64 234/44/113/8/52/- = 451; 64,96,112,112 954/191/447/11/194/- = 1798 (harness_time probe, adds ~5 us over run_tests) [probe_b200]"
  - "launch floor on this B200: an empty-ish 1-block kernel measures 2.4 us under harness timing; but every custom launch here costs 6-17 us because each is a chain of 2-3 dependent global round trips plus a ramp. The lineage assumption '2 us per launch' is wrong by 3-5x; the 5-launch fixed floor is ~35-40 us at S, not ~12 [probe_b200]"
  - "cold dependent-load latency is 0.44 us per step (chain of 8 = 5.5 us, 1 = 2.4 us); a round of loads costs ~1 us once the SM is loaded [probe_b200]"
  - "K1 staging dominates the conv: removing the global->smem staging cut K1 from 20.7 to 6.5 us (1,96,56,56) and 148 to 28 us (8,320,32,32); plain LDG+STS staging (no cp.async) was equal (23 vs 20 us), so the cost is not the LDGSTS instruction. A 64-channel 7-row stage-only kernel took 9.5 us vs 5.9 us for a contiguous float4 read of the same bytes vs 1.9 us floor, i.e. about 8 GB/s per SM through LDG/LDGSTS. Total staged bytes (halo redundancy 5-13x) spread over all SMs is what matters, hence 1-warp CTAs and tall tiles in v3 [probe_b200]"
  - "dead end: same-address float4 atomics from 784 blocks into 384 sums cost K2 21 us at 1,96,56,56; fixed with 4 accumulator copies and at most 48*NC token blocks per image [probe_b200, run_tests]"
  - "cuBLASLt returns 8 heuristic algos for all 16 shapes; top-3 totals are equal within 0.3% at 1,192,28,28 (40.9/41.0/41.0 us), so algo choice is not a lever; the second probe crashed on a later CL-shape algo (illegal launch), not investigated [probe_b200]"
  - "dead end: NCHW strided-batched GEMM2 (m=HW) is slow for HW=49/196/odd and for stride-0 batch: 20-200 us (v1: 8,384,14,14 29.5 us, 2,768,7,7 24 us, 8,768 69 us, 16,768 126 us, 32,768 201 us). Channels-last GEMM2 (m=C) + a 32x32 transpose-add kernel (4-8 us) replaces it for HW<256 or HW%8!=0 [probe_b200]"
  - "TF32 (fp32 operands, torch allow_tf32) vs fp16, cold, us: 784x192x768 5.4/3.3; 784x768x192 6.2/4.3; 98x768x3072 7.3/5.2; 98x3072x768 11.8/7.2; 1568x768x3072 20.2/9.6; 8192x320x1280 19.1/9.7; 8192x1280x320 22.1/11.4; 131072x128x512 57.1/31.4; 802816x96x384 270/129. TF32 avoids the 4.7-14 MB weight conversion but is 1.4-2.1x slower; it only helps if the conversion cannot be overlapped [probe_b200]"
  - "H16: write then read a fp16 scratch after the 2xL2 zero-fill (two launches), us: 0.01 MB 5.4, 20 MB 9.0, 42 MB 14.6, 134 MB 57.4 (ideal at 7 TB/s 5.7/12/38). The hidden round trip costs ~3.6 us over the two-launch floor at 20 MB (the size of the 8,320,32,32 hidden), well under the 10 us refutation bar, and about 1.4x ideal at 134 MB: the materialised fp16 hidden is cheap [probe_b200]"
  - "precision: folding LayerNorm into the GEMM (fp16 d, fp32 partial stats, z = rstd*(Y - mean*u) + cst) and fp16 hidden with b2' as hi/lo fp16 columns passed 16/16 x 10 rounds; per-size max error was not logged by run_tests [run_tests]"
  - "residual weaknesses by launch: K2 reaches 447 us for the 616 MB hidden at the largest size (ideal ~175) and 113 us at 32,128,64,64 (ideal ~40); K1 is 954 us at the largest; K3 costs 6-17 us at every small row because it is a 3-round chain (sumsq, sqrt-reduce, W2 rows). Fusing K2+K3 work into the neighbouring GEMM (custom epilogue) or a TMA-fed conv would remove ~20 us at S [probe_b200]"
paths:
  - {max_tokens: 3200, lang: cuda, width: 128, threads: 32, rows: 2, grid: oneshot, mem: cpasync, launches: 5, cluster: 1}
  - {max_tokens: null, lang: cuda, width: 128, threads: 128, rows: 2, grid: oneshot, mem: cpasync, launches: 5, cluster: 1}
runs_on:
  H200: {runs: true, representative: false, note: "sm_90: cuBLASLt and float4 atomicAdd work, but the stage cost model differs"}
  A100: {runs: false, representative: false, note: "float4 atomicAdd needs sm_90"}
  L40S: {runs: false, representative: false}
risks:
  - "launches_per_call is 5 (6 for HW<256 or odd HW); portal launch gaps may add 1-2 us each beyond the rented numbers"
  - "workspace up to ~800 MB via torch.empty at 64,96,112,112; allocator reuse is assumed"
  - "cuBLASLt heuristic result order is assumed stable; plans are cached per (B,C,H,W) only, never re-tuned"
  - "fp16 hidden and LN-folding error was only checked pass/fail (about 3.5-5 sigma margin from the card), not per-size max error"
measure_first: [B200]
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
