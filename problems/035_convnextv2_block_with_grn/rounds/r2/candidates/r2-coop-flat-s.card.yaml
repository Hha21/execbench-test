  L40S: {runs: false, representative: false, note: "100 KB smem per SM < 107 KB dynamic smem"}
risks:
  - "Gain is small (two rows, -7% each); portal noise of +-0.008 can hide it"
  - "Flat path has a randomized-LN error tail touching atol (1 element in 2.4M at 4,96); harness inputs (lnw=1, lnb=0) pass"
  - "Split-K red.add into out (pre-filled with x by the conv) is order-nondeterministic, within tolerance"
  - "Both kernels set MaxDynamicSharedMemorySize once to the same value (no per-shape shrink; portal-order safe)"
measure_first: [H200]
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
