hypothesis: 'Operator packaging (no kernel changes): per-shape dispatch over the fastest lineage per row on the r3 rented
  runs. D r3-ws-coop-widec at 2,768,7,7 (34.1 vs A 60.1 us) and 8,384,14,14 (53.5 vs 78.4); B r3-coop-flat-bulkrows at 1,192,28,28
  (29.7 vs 36.3) and 1,96,56,56 (29.1 vs 31.0); A r3-a-e1 elsewhere. Each lineage kernel.cu is its own translation unit wrapped
  in a namespace (lin_a/lin_b/lin_d); D3''s unused fp32-anchor export renamed to lin_d_anchor_launch so it does not collide
  with B''s convnext_launch.'
