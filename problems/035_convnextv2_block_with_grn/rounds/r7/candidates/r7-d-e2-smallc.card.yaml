risks:
  - "build must target B200 only (sm_100a); a LOCAL sm_100 target fails to assemble tcgen05"
  - "cooperative launch at ~225 KB dynamic smem and 384 threads requires every SM free (grid = SM count)"
  - "precision margin on the new paths is 79-89% of atol (double fp16 rounding of the hidden), 0 beyond over 10 seeded rounds; less margin than D r6's wide-C rows"
  - "split-K float4/scalar red.add and red.add GRN sums make summation order nondeterministic (max error stable to ~1e-6)"
  - "four rows (8,320, 4,96, 32,128, 64,96) run the slow r0 anchor; only useful merged with lineages A/G there"
  - "every red.add target (gsq per (image,k), the output) is zeroed or prefilled inside phase A before sync 1, which precedes the first add; the workspace is torch.empty"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
