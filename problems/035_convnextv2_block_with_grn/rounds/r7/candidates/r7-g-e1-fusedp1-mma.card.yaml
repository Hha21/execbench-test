risks:
  - "Merge-only: 13 rows run the slow r0 anchor; the merge must take only 64,96 and 32,128 from this kernel"
  - "4 launches per call (K0, pass 1, K3, cuBLASLt nvjet kernel); on these L rows the launch overhead is <1% of 230-860 us"
  - "fp32 red.add into the GRN sums makes their summation order nondeterministic (relative 1e-7; within tolerance)"
  - "Portal/rented ratio for this structure is unmeasured; pass 1 is clock-bound SIMT (likely ~1.25-1.3x), GEMM2 is DRAM-bound (~1.05x)"
  - "cuBLASLt heuristic is cached per (B,C,HW); descriptors, strides and pointers are rebuilt every call"
