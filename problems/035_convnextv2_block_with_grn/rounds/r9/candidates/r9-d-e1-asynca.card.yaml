risks:
  - "gain is 1-3 % rented on five tc rows and nothing on 32,768 / sc rows; below the portal's compute-bound noise (2-3 %) except at 2,768"
  - "flat barrier state lives in module-level __device__ arrays (zero at load, self-reset by the last arriver); an aborted kernel mid-barrier would leave the generation word out of step with the counter only if a CTA died, which cooperative launch does not allow in normal runs"
  - "ld.acquire.gpu spin from 147 CTAs on one line slowed sc rows by 1-2 us; on tc rows the same effect could appear at other arrival skews"
  - "final build's STACK / register count not checked (stamped probe build spills at STACK 64/80 B)"
  - "build must target B200 only (sm_100a); a LOCAL sm_100 target fails to assemble tcgen05"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
