- id: H23
  statement: 'The per-stage time of a tcgen05 ring is max(MMA clk per stage, commit-chain floor of 551-674 clk, stage bytes / ingest ceiling). The floor is paid once per commit group regardless of N <= 256, so stages whose MMA work is >= ~700 clk (N >= 384 at kbs = 1, or N >= 192 at kbs = 2) hide it entirely and run at >= 95% of the UMMA rate with resident operands. Its source (commit, the full-barrier wait + fence, or the single-thread issue loop) is unresolved and does not matter for N >= 384 designs.'
  status: open
  evidence:
  - 'r3-e2 (a): resident commit groups of 4 UMMAs: 551 clk at N=128/192/256 (MMA 256/384/512 clk) in one container, 674 in another; groups of 8 UMMAs: 388 clk per k-block at N=192 (98.8%), 517 at N=256 (99%) [r3-e2-tc-pair-kbs2]'
  - 'r3-e2 (b): ablation at N=192 kbs1: no-MMA 687, MMA-only 844, barrier ping-pong 652, full 852 clk per stage; removing tcgen05.fence no change; committing every second stage 906 -> 865 only: the floor is not the commit instruction count alone [r3-e2-tc-pair-kbs2]'
