- id: H19
  statement: 'A hand-written 2SM tcgen05 TF32 kernel for 131 < B <= 512, where one CTA pair (cluster 2, cta_group::2, M = 256 W rows) computes the whole batch in one pass (N = Bpad <= 512 as two UMMAs of N1 = 256 and N2 = Bpad - 256 into two TMEM accumulators, each CTA supplying N/2 emb rows and 128 W rows, full K = 3072 in the accumulators), with evict_first on the W TMA stream, removes N padding beyond 16, wave quantisation (72 pairs on 74, one wave) and the unhinted write-back. For B <= 256 (one accumulator) 2-k-block stages run at the DRAM floor (r3). For 256 < B <= 512 the MMA work per 1-k-block stage (768-1024 clk) exceeds the commit floor (H23) and the stage bytes (40-48 KB per CTA) sit under the ingest ceiling (H24), so kbs = 1 with 4-5 stages is MMA-bound: predicted 77k clk at Bpad 384 and 98k at 512 at 100%, 85-100k and 105-120k at 80-90%, i.e. 54-65 us portal at 373/384 (vs 83) and 68-80 us at 449/512 (vs 103-104). Worth about +0.035 over the four workloads (score model 0.648 with M -15.7%, L -13.4%).'
  status: open
  evidence:
  - 'estimate: compute per SM at 100% is 2 x 128 x Bpad x 3072 FLOP / 4096 FLOP/clk = 73.7k clk at Bpad=384 (37.5 us at 1.965 GHz, 49 at 1.5 GHz) and 98k clk at 512 (50 / 65.6 us); at 75-85% this is 44-50 us rented at 384 vs 68.8 today, 59-67 at 512 vs 81.2 [analysis r3]'
  - 'r3: the B <= 256 half is built and 16/16 correct: r3-e2-tc-pair-kbs2, 749 clk per k-block at 192/256 real W (DRAM floor), 45.7/48.2 us rented at 192/211 (-7.3/-3.6%); portal result pending [r3-e2-tc-pair-kbs2]'
  - 'r3: the ingest per SM for the pair at Bpad 384 is 16 KB W + 24 KB emb per k-block = 40 KB per 768 MMA clk = 52 B/clk, and 48 KB per 1024 clk = 47 B/clk at 512, under the measured 50-65 B/clk ceiling; the 1SM alternative (full emb per CTA) needs 83 B/clk at 384 and is ingest-bound, so 2SM is required above 256 [r3-e3-tc05-emb-mcast2, analysis r4]'
  - 'r3 open note: a kbs2 ring of 3 stages (80 KB per CTA per stage at 384) does not fit; r4 argues kbs1 x 4-5 stages suffices because the MMA work per stage (768+ clk) hides the commit floor (H23) [r3-e2-tc-pair-kbs2, analysis r4]'
  - 'E1 (r3) never ran (session cut off); E1 (r4) builds the 256 < B <= 512 half'
- id: H20
  statement: 'The one-SM kernel''s 40% efficiency at B = 192-256 comes mainly from emb: every one of the 144 CTAs re-reads the same B x 12 KB of emb from L2 (340 MB at B=192, more than W) and all CTAs hit the same 128 B lines at the same time. TMA multicast of each emb k-block across a 2-CTA cluster (each CTA loads half the rows to both) halves that traffic and gains >= 10% in cycles at 192/211/256; the alternative explanation is ring depth (5 stages of 40 KB at kbs=1 cover only ~1 us of DRAM latency) or the 1SM UMMA shape itself (H21).'
  status: refuted
  evidence:
  - 'r2: at B=192/211 the coupled ring runs kbs=1 with 5 stages because emb fills shared memory; 2x2 stages at 211 cost 63.3 vs 50.6 us: strongly stage-count sensitive [r2-e1-tc05-ef-small]'
