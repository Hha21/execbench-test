  statement: 'FP16 tensor-core maths (tcgen05 kind::f16, fp32 accumulate, cvt.rn operands) for B > 256 runs at up to 2x the kind::tf32 rate with TF32-class error. W stays fp32 in global and is converted in the kernel by converter warps (LDG -> cvt.rn.f16x2 -> STS into the SW128 stage); emb is converted by a pre-pass into an fp16 scratch.'
