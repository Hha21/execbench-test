  - 'r3-e2 (b): every L2-fed ring lands at 51-68 B/clk per SM when converted (1SM N=192 kbs1 40 KB/791 clk = 51; kbs2 68; 2SM kbs2 N=192 28 KB/512 = 55; kbs4 63; N=256 kbs2 32 KB/532 = 60); the warm no-MMA ring at N=192 is 40 KB/687 clk = 58 B/clk [r3-e2-tc-pair-kbs2, analysis r4]'
  - 'r2-e3: cuBLAS TF32 and BF16 both stop at 69-79% at 1965 MHz on hot square GEMMs and reach 89-96% per clock at 1190-1330 MHz: a bytes-per-second ceiling [r2-e3-tf32-ceiling-r1tiles]'
  - 'untested: direct measurement of the ceiling at N >= 384 stage sizes, and its scaling with the SM clock (power-capped vs burst runs of the same ring); E3 (r4) measures both'
