  - 'r6-e1: the converter path, not the MMA or DRAM, sets the pace. An mbarrier.arrive.release from a thread with LDGs in flight waits for those loads (the register prefetch of the next k-blocks), so prefetch depth is lost. A forwarder warp (converters bar.arrive, warp 2 does the release.cluster arrive) gives 1257/1287/1102/1180 clk per 64-k block at 384/512/691/919; the unordered relaxed arrive gives 1097/1114/800/954 against MMA ideals of 768/1024/704/928 [r6-e1-fp16-tch-fwd]'
