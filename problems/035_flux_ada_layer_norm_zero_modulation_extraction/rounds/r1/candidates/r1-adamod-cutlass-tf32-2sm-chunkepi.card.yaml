hypothesis: >-
  One CUTLASS 4.4 sm100 TF32 tcgen05 GEMM per call (2SM MMA, cluster 2x1, persistent CLC scheduler) with operands
  swapped so W is the M side (as cuBLAS tnn). The no-smem epilogue adds bias (C = bias with stride 0 along the batch
  mode). A wrapper re-points D to outs[c] - c*3072 per tile, so the six outputs are written directly: no tmp, no
  scatter, one launch. This matches cuBLAS TF32 GEMM-only time and removes the 3-47 us scatter Tb pays. The tile is
  chosen from B (memory-bound 128x64x16-stage tile at B<=64; 256x192/256x256 at M/L). Error is identical to cuBLAS
  TF32 (same tf32 truncation, fp32 accumulate over the full K).
expected_effect:
  S:
    pct: -63
    confidence: high
  M:
    pct: -78
    confidence: high
  L:
    pct: -75
    confidence: medium
resources_sm100a:
  regs_per_thread: 128
  smem_per_cta_bytes: 229888
  threads_per_cta: 192
  ctas_per_sm: 1
  bytes_in_flight_per_sm: 131072
  launches_per_call: 1
knobs:
  CLUSTER: "2x1x1"
  TILE_K: 32
  S_TILE: "128x64, 16 stages"
  M_TILE_65_128: "256x64, auto stages (11)"
  TILE_129_192_257_384_513plus: "256x192, auto stages (8)"
  TILE_193_256_385_512: "256x256, auto stages (7)"
  RASTER: heuristic (= AlongN: batch tiles of one W tile run together)
