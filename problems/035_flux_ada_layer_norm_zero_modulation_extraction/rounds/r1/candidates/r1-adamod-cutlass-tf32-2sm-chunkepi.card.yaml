risks:
  - "Plain TF32 (operator ruling for #35): max error 1.3-1.6e-3 vs atol 2.0e-3, identical to cuBLAS TF32 and to Tb's own precision; passed 16/16 x 10 rounds rented"
  - "The epilogue wrapper re-points CUTLASS's no-smem epilogue Params per tile through a held copy; it relies on that epilogue keeping a const reference to its Params (CUTLASS 4.4.1 layout)"
  - "D base pointer outs[c] - c*3072 points before the allocation for c > 0; only in-range addresses are dereferenced"
  - "L band is compute-bound at about 68% of the TF32 peak, the same rate as Tb's cuBLAS GEMM: the L gain on the portal comes from the removed scatter/bias pass, about 1.25-1.3x vs Tb"
  - "CUTLASS device asserts are compiled in (no NDEBUG); the four shipped tiles never tripped them in about 30 probe runs and the 16x10 test"
measure_first:
