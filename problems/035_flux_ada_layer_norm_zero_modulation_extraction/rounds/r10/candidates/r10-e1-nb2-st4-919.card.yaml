tests:
  - H28
findings:
  - "lever 1 dead: cuBLAS cublasGemmEx with fp32 A/B/C and CUBLAS_COMPUTE_32F_FAST_16F (74) times identically to FAST_TF32 (77) and gives the same max |err| vs fp64: 373 73.9 us 1.57e-3, 512 77.9 1.54e-3, 691 105.6 1.64e-3, 919 135.0 1.66e-3 (harness_time). It runs the TF32 kernels, 1.4-1.5x slower than tc_h (53/55/79/90); the bias/split wiring was not built [probe_b200]"
  - "tc_h timeline (globaltimer, flush then a direct call, rented), B=384: CTA entry 0-0.3 us, end of prologue (cluster barrier) 2.8, emb staging landed 2.8, emb slice converted 5.9-6.4, grid emb counter seen 7.4, group-0 first W stores 7.2, first full barrier 9.2, last full 45.6 median (max 47.6), accumulator ready 46.3, epilogue end 50.2, kernel end 51.2-53.2; harness 56.5. 512 similar (full0 9.7, last full 47.4, epilogue 5 us). 919: last full of item 0 43.5, item 0 epilogue to 48.9, tfree 49.9, item 1 first full 51.7 (8.2 us MMA idle between items), last full 85.5, end 92.4 [probe_b200]"
  - "the release cluster barrier in the tc_h prologue waits for the thread's emb bulk copy (staging lands exactly at prologue end). barrier.cluster.arrive.relaxed (with __syncthreads for tmem_slot) cuts the prologue from 2.8 to 1.0-1.3 us, but harness time does not move: 384 54.5 vs 54.5, 512 56.7 vs 57.0, 691 82.4 vs 81.4, 919 93.4 vs 93.1 us. Keeping the bulk copy before a relaxed barrier: 53.3/56.0/81.6/93.0 (mixed, within noise). Not shipped [probe_b200]"
  - "dead end: issuing the converters' first W loads before the prologue stretches the release cluster barrier to 5.1 us (release waits for the thread's own LDGs in flight) and gives the same last-full time; it also costs 4 B of spill at the 72-register cap [probe_b200]"
  - "stale-emb bound (no fused conversion, emb16 precomputed): the first full barrier comes 1.8 us sooner (7.4 vs 9.2 us) but the last full only 0.8 us sooner (44.8 vs 45.6): the nb1 W stream is DRAM-throughput-bound from its first load, so the fill order barely matters [probe_b200]"
  - "pure W stream with the tc_h converter mapping (144 x 768 threads, 8 LDG.128 per thread, rows 12 KB apart) under harness_time: 256 B / 512 B / 1 KB / 4 KB row segments 39.8 / 39.8 / 39.7 / 38.8 us with evict_first, 40.1-40.3 without the hint. Segment size is not the lever; tc_h's in-kernel stream (prologue end to last full, about 43 us) is about 3 us slower than this pattern alone [probe_b200]"
  - "ring depth (one container, 3 rounds, harness_time us): 449 st3 54.4 vs st4 55.8; 691 st3 80.4, st4 84.0, st5 84.8; 773 st3 83.9, st4 85.9, st5 97.0; 853 st3 87.7 vs st4 88.7; 919 st3 91.6 vs st4 90.8. Earlier container: 384 54.5 vs 55.8, 512 57.0 vs 57.2, 691 81.4 vs 82.7, 919 93.1 vs 90.4. A 4th stage helps only at ntile 464 nb2 [probe_b200]"
  - "clock diagnostic: looping tc_h at 919 back to back (warm L2, no flush) for 1.5 s power-caps the rented card at 1320-1372 MHz (858 W, 3 stages) and 1297-1327 MHz (973 W, 4 stages): 118 us per call, below the portal's 1500 MHz lock. The 4-stage ring draws about 13% more power per call. harness_time runs with flush gaps stay near the 1.9 GHz burst clock, which fits the 1.33-1.42 portal/rented ratio at nb2 [probe_b200]"
  - "run_tests: 16/16 PASS (10 rounds). vs r8 on the same GPU: 919 88.5 vs 91.0 (-2.8%, the only changed size); unchanged sizes 373-853 -0.6..-1.3%, B <= 211 -4.1..+2.2% (drift; identical code). Emulator 0.6848 +- 0.0070 [run_tests]"
  - "precision max |err| vs fp64 (W/sqrt(3072), bias randn): tc_h 3 stages = 4 stages = 5 stages at every B (same operands, same accumulation order): 384 1.55e-3, 449 1.56e-3, 512 1.68e-3, 691 1.59-1.62e-3, 773 1.68e-3, 853 1.57e-3, 919 1.58-1.65e-3 [probe_b200]"
  - "portal prediction: identical to r9 except 919 (portal r8 119.9, r9 127.8 on identical code); -1..-3% there is within the 4-7% portal noise, score change about +0.0005. This candidate does not reach the 0.70 target [analysis]"
  - "next levers (analysis): (1) nb2 epilogue overlap needs TMEM room. Both accumulators fill 464 of 512 columns, so the 8 us idle time between items stays unless the item shape changes (e.g. cta_group::2 with M = 128, 64 lanes per CTA, double-buffered); the ntile <= 256 double-buffer variant needs 1.3 GB of L2 reads at 919 against 0.85 GB. (2) The nb1 gap to its floor (about 44 us rented) is the 3 us in-kernel stream shortfall plus the 4-5 us serial epilogue, and the epilogue is DRAM-write-bound (28 MB at about 7 TB/s), so only the stream shortfall is open; candidates are converter convoying at the 8-warp group bar.sync, and per-pair DRAM-rate imbalance (last-full spread 44.0-47.9 us) [analysis]"
