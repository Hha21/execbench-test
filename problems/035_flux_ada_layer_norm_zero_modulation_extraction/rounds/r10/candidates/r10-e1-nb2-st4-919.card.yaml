id: r10-e1-nb2-st4-919
parents:
  - r9-e1-skew-uniform-s
operation: new_design
language: cuda_cpp
niche:
  mem: tma-tensor
  st: direct
  grid: oneshot
  launch: fused
  tile: rows128
  red: cta
  cache: stream
  spec: dispatch:size
hypothesis: >-
  E1 lever study. cuBLAS FAST_16F, timelines and ring variants all show that the B > 256 gap to the leaders is not
  in the prologue or the ring depth. In nb1 the W stream ends at about the same time whatever the start does
  (DRAM-throughput-bound fill). In nb2 the MMA sits idle for 8 us at 919 while item 0 is drained; that cannot overlap
  while the accumulators use all 512 TMEM columns. The only measured gain is a 4th ring stage for the MMA-heavier
  nb2 tile of ntile 464 (B = 919), which lets the converter groups run one stage further ahead of the MMA. Every
  other size keeps r9's code path exactly (4 stages measured slower there).
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: 0
    confidence: high
  L:
    pct: -0.5
    confidence: low
resources_sm100a:
  regs_per_thread: 72
  smem_per_cta_bytes: 185344
  threads_per_cta: 896
  ctas_per_sm: 1
  bytes_in_flight_per_sm: 98304
  launches_per_call: 1
knobs:
  TC_H_STAGES: "4 if nb == 2 and ntile >= 464 (B = 919), else 3"
  B_LE_256: "tc_small / tc_pair exactly as r9"
