risks:
  - "the rented gain (-1.3..-2.2% at 691-919) is below the 4-7% portal noise on the FP16 tensor path; one portal result cannot confirm it"
  - "the relaxed TMEM-free arrive relies on tcgen05.wait::ld having completed the TMEM reads before tcgen05.fence::before_thread_sync and the arrive; no shared or global data is handed over by it (the MMA side keeps acquire.cluster + tcgen05.fence::after_thread_sync)"
  - "1024 threads cap registers at 64 for the nb2 kernel; 0 spills now, but any added state in the converter or drain code spills (the pipelined drain did)"
  - "B > 256 inherits r8's grid-wide self-resetting emb counter (same legitimacy note as r8)"
