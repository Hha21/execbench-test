findings:
  - "H18 refuted at build: 2SM swapped tiles 256x144/160/176/208/224/240 fail to compile with static divisibility asserts (cute int_tuple.hpp 'Divisibility Condition', layout.hpp 'Stride/Shape Divisibility Condition') while instantiating the mainloop B-operand smem layout (per-CTA batch rows 72..120), not the epilogue. K tile 16 and 64 fail the same way for 208/224/240. Only batch tiles that are multiples of 64 build (64/128/192/256) [probe_b200]"
  - "probe (interleaved, 3 rounds, harness flush) L band us for 256x64/128/192/256: B=449 113.7/87.5/88.5/80.4; 512 114.0/88.8/89.2/80.7; 691 146.0/116.7/111.9/111.5; 773 168.6/131.8/132.7/138.3; 853 179.1/132.3/133.9/140.1; 919 190.3/148.7/135.2/141.9 [probe_b200]"
  - "padded-work model vs measured: 128-wide tiles cost about 5% more per padded column than 192/256 (919 on 128: 1024 cols 148.7 vs 256: 1024 cols 141.9 vs 192: 960 cols 135.2), so cutting padding from 960 to 896 columns at B=773/853 with 128-wide tiles gains only 0.7-1.2 us (about 0.7%, noise), not the 6.7% the model predicts. 256x64 is 25-40% slower [probe_b200]"
  - "probe: 256x192/256/128 with K tile 64 are 1-12% slower than K tile 32 at every B (e.g. 919: 136.5/147.5/161.0 vs 134.6/141.3/147.9) [probe_b200]"
  - "probe M band us 256x64/128/192/256: B=131 62.4/59.8/56.8/60.3; 192 63.2/60.4/57.2/60.5; 211 72.2/60.2/67.0/60.0; 373 92.9/73.2/68.7/79.7; 384 92.4/74.3/68.7/80.1. The r1 table is already the per-B minimum [probe_b200]"
  - "probe S band us stream/128x64/256x64: B=5 41.1/51.7/53.5; B=16 43.8/48.9/53.6. 128x64/256x64/128/192 at B=32: 48.7/53.6/55.4/56.6; 64: 50.2/53.7/55.8/56.8; 96: 57.2/55.7/56.0/56.8; 128: 57.3/55.7/56.2/57.0 [probe_b200]"
  - "run_tests 16/16 PASS rented B200 us B=5/16/32/96/128: 41.3/43.8/48.9/55.4/55.9; 131/192/211/373/384: 57.0/57.2/60.7/68.8/68.7; 449/512/691/773/853/919: 80.9/81.2/111.8/131.8/133.7/134.7. vs r1 (same GPU): B=5 -20.2%, B=16 -10.5%, every other B within +-1.0% (773 +1.0%, noise); band change S -6.5% M 0.0% L +0.2%; emulator 0.6075 +- 0.012 [run_tests]"
  - "max |err| vs fp64 (weight/sqrt(3072), one trial per B, probe): 1.30e-3 (B=5, stream), 1.62e-3 (16, stream), 1.34e-3 (32), 1.38e-3 (64), 1.39e-3 (96), 1.44e-3 (128), 1.51e-3 (131), 1.65e-3 (192), 1.58e-3 (211), 1.66e-3 (373), 1.52e-3 (384), 1.49-1.55e-3 (449), 1.63e-3 (512), 1.52-1.68e-3 (691), 1.64-1.67e-3 (773), 1.72-1.73e-3 (853, just above the 1.7e-3 bar, below atol 2e-3), 1.59-1.61e-3 (919). All tiles give identical error at a given B; the streaming kernel (cvt.rna emb, W truncated) is within 0.1e-3 of CUTLASS [probe_b200]"
  - "dead end: finer batch tiling is not reachable through the CUTLASS builder; the remaining routes (1SM 128xN tiles are 13-19% slower per FLOP and gain at most 13% padding at B=773; a hand-written tcgen05 kernel) do not pay for padding alone [probe_b200, analysis]"
  - "build: nvcc 13.1, the 4 CUTLASS TUs plus stream_tc compile in parallel in about 40 s; run_tests total 64 s [run_tests]"
