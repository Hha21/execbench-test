hypothesis: >-
  H18 (per-B batch tiles of 208/224/240 remove padding waste at L) cannot be built: CUTLASS 2SM swapped tiles need a
  batch tile that is a multiple of 64, so the buildable widths are 64, 128, 192 and 256. Among those, padded work does
  not predict time, because narrower tiles lose per-column efficiency, so the r1 tile table stays. The portal gain of
  this candidate comes only from the r1-ef streaming kernel (evict_first bulk ring, mma.sync TF32) replacing the 128x64
  CUTLASS tile at B <= 16, where it is 10-20% faster rented. That kernel is DRAM-bound, so it should keep most of its
  rented gain on the portal (ratio about 1.05).
expected_effect:
  S:
    pct: -6.5
    confidence: medium
  M:
    pct: 0
    confidence: high
  L:
    pct: 0
    confidence: high
