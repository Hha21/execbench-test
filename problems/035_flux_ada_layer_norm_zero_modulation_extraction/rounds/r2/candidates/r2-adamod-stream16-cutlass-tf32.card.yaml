risks:
  - "Plain TF32 (operator ruling for #35): max |err| 1.3-1.73e-3 vs atol 2e-3; B=853 was 1.72-1.73e-3, above the 1.7e-3 bar but below the atol (identical to r1 and to cuBLAS TF32)"
  - "Streaming kernel B<=16: evict_first gain depends on the harness leaving dirty flush lines in L2; the portal's locked DRAM clock could change the ratio"
  - "Streaming kernel uses 231 KB dynamic smem, 1 CTA/SM on 144 of 148 SMs"
  - "ChunkedEpilogue relies on the CUTLASS 4.4.1 no-smem epilogue keeping a const reference to its Params (inherited from r1)"
  - "Gain exists only at B=5 and 16 (2 of 16 workloads): about +0.006 on the portal; M and L are identical to r1"
