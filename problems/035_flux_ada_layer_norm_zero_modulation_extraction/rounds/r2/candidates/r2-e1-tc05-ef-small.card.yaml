risks:
  - "The S-band gain depends on the dirty-L2 state the harness's zero_ flush leaves behind. The size of the hint's benefit varied 1.5-9 us between rented containers; the portal's locked DRAM clock could change it again"
  - "Plain TF32 (operator ruling): max |err| 1.27-1.62e-3 vs atol 2e-3 depends on the TFLOAT32 tensor-map type rounding; switching to FLOAT32 would fail"
  - "B=192/211 sit at kbs=1 (5 stages) because emb fills shared memory; they are the slowest tc paths (49-51 us)"
  - "144 CTAs on 148 SMs leave 4 SMs idle (about 2.7% of DRAM issue capacity)"
  - "createpolicy evict_first is applied only to this call's own weight buffer, inside the kernel (constraint list); no applypriority, no persisting window"
  - "The idle threads of warps 0/1 and warps 2/3 spin on mbarrier try_wait for the whole mainloop; harmless here (1 CTA/SM, DRAM-bound)"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
