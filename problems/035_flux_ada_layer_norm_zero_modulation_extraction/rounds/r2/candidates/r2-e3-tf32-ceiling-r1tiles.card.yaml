tests:
  - H12
findings:
  - "H12 step 1 (harness mode: flush + CUPTI, clock read in-kernel at 1960-1975 MHz, 3 rounds, spread < 3%): cuBLAS TF32 4096^3 822-854 TF/s (69-72% of clock peak), 8192x8192x2048 894-897 (75%), 8192^3 846-847 (71%); BF16 4096^3 1692-1697 (71%), 8192x8192x2048 1890 (79%), 8192^3 1640-1652 (69%). TF32 is NOT uniquely capped: BF16 stops at the same fraction [probe_b200]"
  - "H12: same shapes under sustained back-to-back load are power-capped (throttle reason 0x4 SW power cap, ~1000 W) to 1190-1330 MHz and then reach 89-91% (TF32 8192^3 716 TF/s at 1330 MHz) and 94-96% (BF16 1361 TF/s at 1200 MHz) per clock: the ceiling does not scale with the SM clock, so it is not SM-side shared-memory traffic or the TF32 issue rate; likely L2/fabric (~13 TB/s operand reads in both dtypes) [probe_b200]"
  - "H12 verdict: refuted as a TF32-specific hardware cap and as a shape-specific loss. cuBLAS on our shape at B=1024 (no padding) gets 75% per clock at 1965 MHz, the same as square. B=919 gets 68.5% only because of N padding [probe_b200]"
  - "probe: the rented card's clock state drifts. The same cuBLAS L919 GEMM ran 128-136 us in short-burst runs at ~1965 MHz and 167-175 us after sustained loops (1349-1427 MHz). Rented time differences of ~7% between sessions with identical code are clock or thermal, not kernel changes [probe_b200]"
  - "run_tests (code identical to r1, comments only): 16/16 PASS; B=5..128 51.8/48.9/49.0/55.3/55.8, M 56.9/57.1/60.5/66.9/66.5, L 75.7/76.6/103.1/122.6/124.1/125.2 us. The L -7% vs the stored r1 times is clock drift (same binary), so the emulator's 0.615 is spurious: expect the portal to repeat r1's 0.588 [run_tests]"
  - "dead end: cluster 2x2 (W tile multicast to two pairs along the batch dim) is 20-30% slower: 919 153.6-159.7 vs 125.2 us; 691 118-150 vs 101.6; 512/449 99-118 vs 75.7; 384 82.7-98 vs 66.3 [probe_b200]"
  - "dead end: K-tile 16 (16/14 stages) is 10-19% slower and K-tile 64 (4/3 stages) is 2-7% slower than K-tile 32 at B=449-919; max_swizzle 2/4 is +0.5-1.5% slower than 1 [probe_b200]"
  - "tile check (harness mode, interleaved x3): 256x192 vs 256x256 at 919 125.0 vs 130.9, at 691 101.6-103.3 vs 102.4-103.5, at 512 83.7 vs 75.6, at 449 83.3 vs 75.7, at 384 66.3 vs 75.1 us: the r1 dispatch table is already optimal among the tiles that build [probe_b200]"
  - "dead end: 2SM 256x240 does not build in CUTLASS 4.4.1 (B-operand smem layout/TMA static assert; 120 batch rows per CTA) [probe_b200]"
  - "max |err| vs fp64 (W/sqrt(3072), bias randn) at B=919: 1.58e-3 on one draw, 1.79e-3 on another (above the 1.7e-3 bar, under atol 2e-3). Identical for every tile, cluster and K-tile variant (same tf32 truncation). The margin depends on the draw; the harness passed 16/16 x 10 rounds [probe_b200, run_tests]"
  - "method: CUTLASS variants build in a probe with nvcc -c in parallel (~30 s for 4-6 TUs on 24 cores) into /tmp/*.so loaded by ctypes; /tmp persists between probes, so build and time can be split [probe_b200]"
  - "consequence: any remaining L gain needs fewer L2 bytes per FLOP without 4-CTA clusters, or less N padding (E2/H18: 208/224-wide tiles). The tcgen05 rate itself cannot be raised by tile, stage or scheduler knobs [INFERRED]"
