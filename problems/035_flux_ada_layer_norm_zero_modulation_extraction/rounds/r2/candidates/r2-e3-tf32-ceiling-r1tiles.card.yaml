hypothesis: >-
  E3 result, not a new mechanism. Under harness conditions at 1963-1975 MHz, tcgen05 GEMMs stop at about 70-79% of the
  clock peak for both TF32 and BF16, on square and on our shapes. When power-capped to 1.2-1.33 GHz they reach 89-96%.
  So the ceiling sits in a domain that does not scale with the SM clock, likely L2/fabric. It is neither TF32-specific
  nor shape-specific, and it is not the SM-side shared-memory traffic model. W multicast (cluster 2x2), K-tile 16/64,
  and raster swizzle 2/4 are all slower. The r1 dispatch is kept unchanged (comments only) as the best tested version.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: 0
    confidence: high
  L:
    pct: 0
    confidence: medium
