risks:
  - "Rented gain at 192/211 is only -3.6..-7.3% because the rented kernel is already near the DRAM floor; the larger portal gain relies on the clock-bound ratio (1.26 portal/rented for tc_small at 192/211) and is unproven until a portal slot"
  - "A broken pair pipeline would hang; mbar_wait traps after 2^27 try_waits so a failure shows up as an error, not a hang"
  - "Cluster launch of 72 pairs on 148 SMs depends on GPC packing; the portal card could place fewer pairs per wave (not seen on the rented card)"
  - "Probe containers differ by 10-20% in absolute cycles per commit (551 vs 674 clk); every cycle number is valid only inside its own probe"
  - "TMA .cta_group::2 qualifier order and the mapa leader-barrier convention were verified only by 16/16 correctness, not against CUTLASS source"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
