risks:
  - "Not re-tested this round: the shipped sources are the r3-e2-tc-pair-kbs2 files with one comment added to kernel.cu; the portal result for r3 is still pending"
  - "The ring probe feeds every pair from the same 16 hot W tiles and the same emb rows; a real kernel streams W from DRAM, so the feed numbers (93-100 B/clk) are an L2-hot upper bound, and the DRAM floor (about 42 us rented) still applies to a real B > 256 kernel"
  - "Probe containers differ by 10-70% in the commit-chain floor (551 vs 674 vs 840 vs 940 clk); all cycle comparisons here are inside one probe container"
  - "Only burst (idle, 1.66-1.96 GHz) and power-capped (1.14-1.24 GHz) clocks were measured; the portal lock is 1.5 GHz, so the CUTLASS cycle count at 1.5 GHz is interpolated (about 128k clk)"
