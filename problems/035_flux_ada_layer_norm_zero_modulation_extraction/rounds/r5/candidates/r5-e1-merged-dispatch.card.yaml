id: r5-e1-merged-dispatch
parents:
  - r4-e1-tc-pair2-twoacc
  - r4-e2-tc-pair2-nb2
operation: crossover
language: cuda_cpp
niche:
  mem: tma-tensor
  st: direct
  grid: oneshot
  launch: fused
  tile: rows128
  red: cta
  cache: stream
  spec: dispatch:size
hypothesis: >-
  E1/H27: one per-B dispatcher built from the existing kernels, with the winner at each B chosen from one interleaved
  same-container run in SM cycles. Measured result: r4-e2's pair kernel with nb=1 beats both r4-e1's tc_pair2 and the
  CUTLASS tile at 373-449 and ties tc_pair2 at 512. The same kernel with nb=2 beats CUTLASS 256x192 by 4.4-4.5% in
  cycles at 773/853 and ties it at 691/919. tc_pair2 (r4-e1) and the 256x256 CUTLASS tile win nowhere and are dropped,
  so the build has four kernels (tc_small, tc_pair, tc_pairnb, CUTLASS 256x192) and builds well inside the 120 s limit.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: -8
    confidence: medium
  L:
    pct: -4
    confidence: low
resources_sm100a:
  regs_per_thread: 40
  smem_per_cta_bytes: 231424
  threads_per_cta: 128
  ctas_per_sm: 1
  bytes_in_flight_per_sm: 184320
  launches_per_call: 1
knobs:
  NB_AT_257_512: 1
  NB_AT_721_880: 2
  KBS: 1
  STAGES_RULE: "(226 KB - 1 KB) / (16 KB + Ntile/2 * 128 B): 5 at Ntile 288-464, 4 at 480-512"
  W_HINT: evict_first
  TMA_DTYPE: TFLOAT32
  CLUSTER: 2
dispatch:
  - max_tokens: 131
    kernel: tc_small_kernel (unchanged r2 path)
    meta:
      launches: 1
  - max_tokens: 256
    kernel: tc_pair_kernel (unchanged r3 path, kbs 2)
    meta:
      launches: 1
  - max_tokens: 512
    kernel: tc_pairnb_kernel
    meta:
      nb: 1
      launches: 1
  - max_tokens: 720
    kernel: Tf32Gemm<256,192,0>
    meta:
      launches: 1
  - max_tokens: 880
    kernel: tc_pairnb_kernel
    meta:
      nb: 2
      launches: 1
  - max_tokens: null
    kernel: Tf32Gemm<256,192,0>
    meta:
      launches: 1
tests:
  - H27
  - H19
  - H22
findings:
  - "interleaved same-container table (3 rounds, harness_time with 252 MB flush; kcyc = wall x SM MHz, MHz = median over SMs of dclock64/dglobaltimer between a tiny kernel launched before and after the candidate; spread of the 3 walls < 1%). B=373: tc_pair2 69.0 us 1819 MHz 125.6 kcyc | nb1 64.6 us 1807 MHz 116.7 kcyc | CUTLASS 256x192 68.8 us 1812 MHz 124.6 kcyc. B=384: tc_pair2 69.4/1821/126.3 | nb1 65.0/1804/117.3 | c192 68.5/1826/125.1. B=449: tc_pair2 72.5/1795/130.1 | nb1 69.8/1788/124.7 | c256 81.0/1795/145.4. B=512: tc_pair2 76.8/1777/136.6 | nb1 76.3/1775/135.4 | c256 81.3/1776/144.5. B=691: nb2 121.3/1753/212.6 | c192 111.7/1722/192.5 | c256 111.9/1731/193.7. B=773: nb2 124.9/1739/217.2 | c192 132.8/1710/227.1 | c256 138.8/1724/239.3. B=853: nb2 126.8/1717/217.6 | c192 134.3/1697/227.8 | c256 141.0/1706/240.5. B=919: nb2 134.4/1711/229.8 | c192 135.3/1694/229.2 [probe_b200]"
  - "decision per B: 373 nb1, -6.3% cycles vs c192 and -7.1% vs tc_pair2 (cycles rule); 384 nb1, -6.2% vs c192, -7.1% vs tc_pair2 (cycles rule); 449 nb1, -14.2% vs c256 and -4.1% vs tc_pair2 (cycles rule); 512 nb1, within 3% of tc_pair2 (-0.9% cycles) so the lower wall time decides (76.3 vs 76.8), -6.3% cycles vs c256; 691 CUTLASS 192 (nb2 is +10% cycles; c192/c256 tie, CUTLASS preferred); 773 nb2, -4.4% cycles vs c192 (-6.0% wall); 853 nb2, -4.5% cycles (-5.6% wall); 919 CUTLASS 192 (nb2 +0.3% cycles, true tie, CUTLASS preferred) [probe_b200]"
  - "refutation clauses: nb1 beats tc_pair2 and CUTLASS at 373/384 by >= 3% (6-7%), so 373/384 do not fall back to CUTLASS; nb2 gain at 773/853 is >= 3% (4.4-4.5%), so CUTLASS does not stay at all L > 512. Neither clause fires. The success target '449/512 <= -8%' is met at 449 (-14% cycles vs CUTLASS) and missed at 512 by cycles (-6.3%), though run_tests wall is -8.9% vs r3 [probe_b200, run_tests]"
  - "run_tests 16/16 PASS x 10 rounds, one launch per call (harness CUPTI sequence matching passed). Rented us vs r3-e2-tc-pair-kbs2 on the same GPU: 373 63.9 vs 68.7 (-7.0%), 384 64.0 vs 68.5 (-6.6%), 449 68.6 vs 81.4 (-15.8%), 512 74.9 vs 82.2 (-8.9%), 691 110.4 vs 111.9 (-1.3%, same CUTLASS code, drift), 773 122.5 vs 131.8 (-7.1%), 853 124.5 vs 133.4 (-6.7%), 919 133.4 vs 133.6 (-0.2%); B<=256 unchanged code (noise +-3.6%, 131 +3.6%, 192 +1.5%, 211 +0.9%). Band S +0.5%, M -1.6%, L -6.8%; emulator 0.6301 +- 0.0116, P(beats 0.6166) = 89% (no paths passed to it, so parent features were assumed) [run_tests]"
  - "versus r2-e1-tc05-ef-small the 192/211 criterion (<= -5%) is met at 192 and missed at 211: this round does not change the 192/211 path, and r3 recorded -7.3% / -3.6% for it [analysis]"
  - "precision, max |err| vs fp64 x1e-3 over 3 draws (W/sqrt(3072), bias randn): nb1 B=373 1.68/1.54/1.47, 384 1.58/1.58/1.60, 449 1.64/1.63/1.60, 512 1.59/1.56/1.56; nb2 B=773 1.63/1.65/1.77, 853 1.56/1.56/1.60. Worst draw 1.77e-3 (773) is above the 1.7e-3 bar and below atol 2e-3; 0 elements outside atol + rtol in the interleaved run (one draw per B, all candidates identical to 3 digits). tc_small/tc_pair code is unchanged from r2/r3 (recorded 1.45-1.64e-3 at 132-256) and was not re-measured over 3 draws [probe_b200]"
  - "static: cuobjdump of the tc_pairnb kernel gives REG 40, STACK 48, LOCAL 0, SHARED 1168 (static). The 48 B stack is the OutPtrs kernel-parameter array indexed by the runtime chunk c (6 pointers x 8 B), one load per thread; it is not the r4-e2 epilogue-remap spill, and the timed epilogue matches r4-e2. compile_b200 was not run on the final set [probe_b200]"
  - "build time: run_tests (build plus 16 workloads x 10 rounds plus timing) took 58 s in total, so the build is far below 120 s; the single CUTLASS TU is about 29 s. Dropping tc_pair2 and the 256x256 tile removed two translation units [run_tests, probe_b200]"
  - "r4-e1 portal result not available (archive shows pending), so the hand-kernel portal/rented ratio stays at the assumed 1.10-1.15; the pending ratios at 192/211/449/512 are still needed to calibrate. Important caveat: the portal runs tc_pair2 at 449/512 and this kernel runs nb1, so r4-e1's portal result does not calibrate nb1 exactly (both are hand kernels with the same stage ring) [analysis]"
  - "probe infra: 24 cores, nvcc 13.1 and /usr/local/cutlass present; the three .so builds (hand kernels, c192, c256 in parallel) took 28.8 s and the whole M-band timing probe 34 s, the L-band 4.5 s (cached .so). /tmp survived between the two timing probes but not the third, so keep each probe self-contained [probe_b200]"
  - "dead end: none new. The sandwich clock method (tiny kernel on 296 blocks keyed by %smid before and after the candidate, median over SMs of dclk/dglobaltimer) worked for both hand kernels and CUTLASS; its kcyc includes about 2-4 us of launch gap, equal across candidates [probe_b200]"
