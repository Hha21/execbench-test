risks:
  - "Portal gain at 373/384 rests on the per-stage floor behaving the same at the 1.5 GHz lock: rented nb1 gains 6-7% in cycles, but the earlier tc_pair2 portal prediction for these Bs was equally optimistic and is unconfirmed"
  - "nb1 at 512 is a tie with tc_pair2 (0.9% cycles); the pending r4-e1 portal result is for tc_pair2 and does not directly calibrate nb1"
  - "773 draw reached 1.77e-3 max error (below atol 2e-3, above the 1.7e-3 internal bar)"
  - "nb2 loses 10% at 691 and ties at 919, so the 720-880 window is tight: a B near 700 or 900 must stay on CUTLASS (the dispatch table only serves the workload set 773/853 there)"
  - "Uses 226 KB of dynamic shared memory plus 150 B static in the tc_pairnb kernel; a toolchain change in static shared memory could make the launch fail with a launch error, not a wrong result"
measure_first:
