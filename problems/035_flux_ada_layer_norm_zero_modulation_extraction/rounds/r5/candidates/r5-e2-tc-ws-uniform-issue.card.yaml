risks:
  - "B > 512 runs two waves (144 pairs on 74 slots), with the epilogue not overlapped; at 919 the rented gain is only -2.4% against CUTLASS at a higher clock, so the portal L gain depends on the hand kernel being cycle-bound (predicted -15%)"
  - "One max-error draw at B=919 reached 1.72e-3 (above the 1.7e-3 bar, below atol 2e-3), the same class as the other TF32 paths; the 10-round harness check passed"
  - "tc_ws is slower in cycles than tc_pair at ntile <= 256 for an unresolved reason (2D vs 3D W TMA box suspected); that range stays on tc_pair"
  - "CUTLASS is removed from the solution; any B > 256 shape now depends on the hand-written kernel (correct on 14 B values 132-919 in the probe plus the 16 workloads x 10 rounds)"
