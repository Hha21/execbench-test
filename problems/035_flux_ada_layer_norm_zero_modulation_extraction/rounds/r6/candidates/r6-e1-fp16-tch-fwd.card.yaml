risks:
  - "two launches per call for B > 256 (fp16 emb pre-pass + GEMM); the gap and the pre-pass are timed. PDL is lint-blocked. One harness_time CUPTI sequence-match failure was seen in a probe (retry passed; run_tests passed twice)"
  - "373/384 are flat on the rented card (+1%); the portal gain there assumes the kernel scales with ns rather than SM cycles, which is unverified until the portal result"
  - "the hand-off relies on bar.arrive/bar.sync memory ordering plus the forwarder's release.cluster; the faster relaxed arrive is not shipped because it is formally unordered"
  - "FP16 operands: max |err| 1.54-1.68e-3 against atol 2e-3, the same margin as TF32. emb values beyond about 65504 would overflow fp16; randn inputs are about 6 at most"
  - "the 131 < B <= 256 band stays on TF32 tc_pair (portal 50.9/54.3 us); FP16 there is untested"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
