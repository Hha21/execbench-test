risks:
  - "two launches per call for B > 256 (fp16 emb pre-pass + GEMM), as in r6, which passed the portal; PDL is lint-blocked"
  - "stages >= groups is a hard correctness invariant (asserted statically and checked on the host, status 433); a later knob change to 2 stages would hang"
  - "nb2 is L2-bandwidth-bound on the rented card; if the portal's L2 does not scale with the locked SM clock, the portal ratio could be lower (better) or the gain smaller than rented"
  - "FP16 operands: max |err| up to 1.80e-3 on one draw (691) against atol 2e-3, the same class as r6/TF32; emb beyond about 65504 would overflow fp16 (randn inputs are about 6 at most)"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
