risks:
  - "grid-wide counter: a 2-word device scratch allocated and zeroed once (static); every call increments it and the last CTA to pass the wait resets it, so it is zero at each call's start (the ledger allows 'a scratch counter that is correct for every call'). The r7 session declined to ship this kind of state, but only because it gave no gain there; it is worth an operator legitimacy check before a portal slot"
  - "the fused path needs all 144 CTAs (72 two-CTA clusters) co-resident; this is checked once with cudaOccupancyMaxActiveClusters at 225 KB smem (74 fit on B200). If fewer fit, the code falls back to the r7 pre-pass (2 launches). A spinning CTA traps after about 2^26 polls rather than hanging"
  - "the first call does cudaMalloc + cudaMemset + cudaDeviceSynchronize (one-time setup during correctness round 0, not in timed calls)"
  - "72 registers per thread is exactly at the cap for 896 threads x 1 CTA; any change to the converter epilogue may spill (check ptxas)"
  - "stages >= groups invariant still holds (asserted statically, status 433 on the host)"
  - "FP16 operands: max |err| up to 1.73e-3 on one draw at 513 (1.83e-3 at B = 1024, not a workload) against atol 2e-3, the same class as r6/r7"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
