risks:
  - "gains are small (1-3% at 128/192/211, noise elsewhere) and at the edge of rented noise; the portal may show no change"
  - "skew changes only the K summation order (fp32 accumulation in one TMEM accumulator over the full K); max |err| stays at 1.4-1.7e-3"
  - "B > 256 inherits r8's grid-wide self-resetting emb counter (same legitimacy note as r8)"
measure_first:
