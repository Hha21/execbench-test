# Hypothesis ledger for #38, maintained by the research lead (round.py lead) and read by every design session.
# status: open | supported | refuted | parked. evidence cites kernels, portal submissions, probes or findings.
# Seeded 8 October from rounds r1-r10 and the portal results; updated by the research lead for r11, r12 and r13 (8 October).

constraints:
- 'No deliberate delay before launch (CPU busy-wait, sleep, extra host work) and nothing else meant to change when our kernel reaches the GPU relative to the harness''s flush memset: a kernel that arrives ~60 us late, after the 73 us flush, measures ~0.4 us faster at small sizes on the same code (#84 r1 E1). It exploits the timing methodology, not kernel speed. Off-limits unless NVIDIA approves.'
- 'No discard/invalidate of cache lines (discard.global.L2 etc.), even on our own inputs: it targets the harness''s measurement,
  not kernel speed. Off-limits unless NVIDIA approves.'
- Never touch memory we do not own; no state carried between calls except a scratch counter that is correct for every call.
- 'No overlap with the harness''s own kernels (no PDL against the flush memset, no other streams): it hides work from the
  timed window.'
- 'Clusters only at <= 300 tokens (H16): clustered large grids lost 2-5% on the portal and seemed to slow later plain launches.'
- 'Eviction-priority operations (createpolicy, applypriority.L2::evict_normal) only on the current call''s own input/output
  buffers, inside our kernel. Any candidate that uses applypriority goes to the operator for a legitimacy check before a
  portal slot (r13, H21).'
hypotheses:
- id: H1
  statement: Output stores marked L2 evict_last keep output in L2 past the end of the timed window, so medium sizes gain most.
  status: supported
  evidence:
  - 'portal: r5 0.609 vs r3 0.588 (M -8%)'
  - 'probe r10: evict_last stores beat plain stores by 8-19% at 128-1024 tokens, 2.5-5% at 4096-8192'
  - 'probe r10: the saving is capped at 3-4 us (~25-30 MB) from 1024 tokens up; partial/fractional evict_last is no better
    (see H15)'
  - 'r12 E1: after a CLEAN flush all store policies tie at 586-1024 tokens; the EL gain exists only after the dirty flush
    (non-EL stores pay 2.7/5.0 us dirty cost at 586/1024, EL 1.2/1.9). EL on the first output beats EL on the last. So the
    mechanism is fewer in-window dirty write-backs, not output parked past the window; the statement''s wording is wrong
    but the effect stands'
- id: H2
  statement: evict_first on stores and evict_last on weights hurt on B200.
  status: supported
  evidence:
  - 'portal: r2 0.576 (hinted 256-bit) = g2 0.577 (hinted 128-bit); d1 0.582 (no hints)'
  - quack sm100 regression
  - 'portal r7 vs c1 at L (same code except x evict_first + nc weights): +1.9..+2.6%; evict_first on x costs at L too'
- id: H3
  statement: 256-bit loads/stores help medium and large sizes a little.
  status: supported
  evidence:
  - 'portal: r3 (256-bit, no hints) vs d1 (128-bit, no hints): M -2.4%, L -1.2%'
- id: H4
  statement: CTA launch/retire overhead is a bottleneck, so fewer, fatter CTAs or one resident wave help.
  status: refuted
  evidence:
  - 'r14 A1 (CUPTI, 7 interleaved reps): c2 dispatch has the best R at every size; R=3 wins only at 1024 tokens; R=2 is worst everywhere'
  - 'probe r10: one-wave grids tie at 12.6-101 MB and lose 11-15% above 200 MB'
  - 'portal: r8 512-thread CTAs at L +3.2%'
  - 'probe r10: all 768 CTAs of the 12.6 MB grid start within 0.06 us; the empty-grid span overlaps fully with memory work
    at L'
  - 'probe r11 E3(1): empty-kernel CUPTI floor ~1.4 us at any block size; 768x256 1.63 us; launch params/API/smem/priority
    move it by < 0.03 us'
- id: H5
  statement: TMA / bulk-copy pipelines cut SM instructions per byte and win at the portal's 1500 MHz SM clock.
  status: refuted
  evidence:
  - 'probe r10: bulk stores 27% slower than STG.256 at 805 MB; bulk loads +3%; TMA + mbarrier setup adds ~0.8 us at 12.6 MB'
  - 'portal: g2-tma 0.510, g2-tmaws 0.537; bench r10-bulk1d-ring-stel predicted 0.5815 (its L was within 1.3% of c2 with
    EL stores; S +23%, M +9% from the ring prologue)'
  - 'r13 note: refuted as a bandwidth lever only. Whether the async proxy allocates in L2 differently against the dirty
    residue was never measured (H23)'
- id: H6
  statement: Persistent grids with work stealing remove the tail and beat one-shot.
  status: refuted
  evidence:
  - 'probe r10: one failing atomic per CTA costs ~1 us at 12.6 MB; pipelined stealing +9-10% at S/M, +0.7% at L; static persistent
    3% worse than stealing at L'
  - 'portal: v039, g2-ws, g2-tma all slower; bench r10-ws-l-steal-disp predicted 0.605'
- id: H7
  statement: The harness's zero-fill flush leaves dirty lines in L2; their write-back during our kernel costs ~0.5 us at S
    and ~4 us (about 30-40 MB) at M/L, and the cost lands on reads, not writes.
  status: supported
  evidence:
  - 'probe r10: in-kernel span after zero flush vs read-only flush: 12.6 MB 3.07 vs 2.56 us, 25 MB 4.10 vs 3.58, 100 MB 16.6
    vs 12.3'
  - 'probe r10: read-only kernels +7..11 us at 100-400 MB after a zero flush, copy +5..6 us, write-only +-1 us'
  - 'r12 E1 (c2 paths, dirty minus clean, bench): 586 tok 1.2 us (13%), 1024 2.0 (14%), 2048 4.6 (16%); r10: ~5 us at L
    (4-5%). This is the single largest identified pool: half of it is worth +0.02 (predict_score 0.634), all of it +0.04'
  - 'no legitimate kernel-side mechanism found yet; load hints do not avoid it at >= 1024 tokens (H8, H18); the mechanism
    model is H22'
- id: H8
  statement: evict_first on the streamed loads makes later allocations evict our own clean lines instead of dirty flush lines,
    cutting H7's write-backs.
  status: refuted
  evidence:
  - 'probe r10: read-only kernel -13 to -15% with evict_first loads, but the full kernel with evict_last stores gains only
    1-2% at 256-1024 tokens (8% once at 586), 0 to +1.5% above; .cs/.lu/no_allocate/nc+EF all within +-2%'
  - 'bench r10-ldef-real-stel-disp: S -0.8%, M -1.2%, L +0.3% vs r6; kept as a ~1% tweak for B*S <= 1024, not a lever'
  - 'r10: the CUTLASS EVICT_FIRST constant passed as a kernel argument is a no-op; the qualifier or createpolicy form works'
  - 'r12 E1 curve: with EF loads the dirty cost is flat at ~0.55 us up to 586-700 tokens (<= ~34-40 MB of EL output) and
    then grows; EF gain -7% at 800 tokens, -0.8% at 1024, +1.1..+1.4% at 1536-2048. The recycling works only while the EL
    output footprint is under ~40 MB'
- id: H9
  statement: 'The portal (SM 1500 MHz) penalises SM-bound designs more than the bench (~1940 MHz): kernels that lag a plain
    copy on the bench lose more on the portal; the clock-bound share is ~2.5 us of 4.2 us at 12.6 MB and ~6 us of 14.5 us
    at 100 MB.'
  status: supported
  evidence:
  - 'emulator fit on 18 kernels: about +5% portal time per 20% copy lag at L'
  - r8/r9 bench -1% -> portal +3-4%
  - 'portal/bench ratios: c1 S +15%, M +9%, L 0% (INFERRED split of the clock-bound share)'
  - 'r11-consol: copy lag of the current paths: S +3-5% (the shuffle/rsqrt chain, 0.15-0.2 us), 1024 R=3 +0.1%, 2048-8192 0%'
  - 'r10-rtok R=3 (48 regs) at 1024 tokens: bench -2.7%, portal -2.4% vs c1; the 48-register path did not lose extra on the portal'
  - 'r12: clock locking on the rented B200 is refused (nvidia-smi -lgc/-pl/-ac, no permission; SM 1965 MHz under load), so the
    emulator stays'
- id: H10
  statement: At 12.6 MB the one-shot kernel already equals a plain copy; the remaining S time is ~1 us outside the CTAs (clock-bound),
    one DRAM round trip (~0.7 us), streaming at the ~6 TB/s read cap, and H7's write-backs.
  status: supported
  evidence:
  - 'probe r10 timelines: all 768 CTAs start within 0.06 us, first load returns at 0.67 us, last at 2.9 us; in-kernel span
    3.1-3.3 us vs 4.16 us CUPTI'
  - 'probe: copy 4.4 us vs r5 4.2 us (bench); empty 768-CTA grid 1.57 us'
  - 'probe r11 E3(3), 128 tokens, medians of 105: CUPTI/in-kernel: EL stores 4.51/3.42, plain stores 4.35/3.30, no stores
    3.80/2.75, empty body 2.02/0.38. Outside-the-CTAs 1.05 us with or without stores (launch front-end + teardown); reads
    12.6 MB in ~2.1 us (~6 TB/s); stores add 0.67 us'
  - portal marginal 12.6->25 MB 7-8 TB/s; fixed ~3.0 us on the portal
  - 'r13 arithmetic: our bench fixed cost (4.0 - 12.6 MB/7 TB/s = 2.2 us) equals CAKE''s tiny-kernel floor; the portal''s extra
    0.6 us at 128 tokens is the clock-bound launch hardware. A leader 0.9 us faster on every S workload is implausible'
- id: H11
  statement: 'The ~7 TB/s read+write ceiling at L is DRAM/L2-side: read-only bandwidth (5.0-6.3 TB/s clean) does not rise with
    more active SMs, more in-flight bytes per SM, TMA, or die-affine addressing, so no SM-side change can lift L.'
  status: supported
  evidence:
  - 'probe r10: read-only 402 MB 71.9 us (64 us clean, 5.6-6.3 TB/s); write-only 54.6 us (7.4 TB/s); copy 6.7-6.95 TB/s'
  - 'probe r10: 64-128 KB in flight per SM (R=2..4) and bulk loads do not beat r6 at L'
  - 'probe r11 E1: read-only 400 MB gated by %smid: 148 SMs 83.9 us, 74 SMs (any half) 81.5-84.1 us, 37 SMs 91.3 us. Half the
    SMs reach 100% of full read bandwidth'
  - 'probe r11 E1: affine/mixed/sorted reads 77.4/77.8/78.2 us; anti-affine 96.9 (+25%, cross-die cap ~3.8 TB/s)'
  - 'open corollary: the mixed read+write stream (7.0 TB/s) beats alternating pure phases (read 6.3, write 7.4 -> harmonic 6.8),
    so read/write phasing cannot help'
  - 'r13 caveat: the 7.0 TB/s ceiling was measured after the dirty flush; clean-flush copies at 1024-2048 tokens run at 8+ TB/s
    apparent (12.6 us / 100 MB, 24.2 us / 201 MB), so the L ceiling is a dirty-L2 ceiling (H7), not pure DRAM'
- id: H12
  statement: Each B200 die homes half the HBM/L2; the address-to-partition hash is visible in low address bits, and a CTA
    reading only lines homed on its own die gets higher bandwidth or lower latency than mixed traffic, so a die-affine tile
    assignment lifts M/L.
  status: refuted
  evidence:
  - 'probe r11 E1: cold-miss latency is bimodal (~790 near vs ~1160 cycles far); die map recovered (group A 72 SMs, group B 76);
    home granularity exactly 4 KB; no XOR mask of bits 7..20 correlates (> 0.08): the hash uses physical bits above 2 MB'
  - 'probe r11 E1: read 350 MB classified: affine 77.4 us, mixed 77.8, anti-affine 96.9; copy 265+265 MB affine/mixed within
    1%; per-die queue needs one atomic per CTA (+6-7% at L)'
  - 'r11-e1-h12-control: dead end, do not revisit'
- id: H13
  statement: FlashInfer's sm_100 layout (4 lanes per row, 32 floats per thread, 8 rows per warp instruction) beats the half-warp-per-row
    layout on B200, especially at 4-60 MB.
  status: refuted
  evidence:
  - 'fi-pr5305: 1.14x at M=8192, 1.20x at M=32768 rows (bf16) on B200'
  - 'probe r11-fi4lane: 4-lane and 8-lane layouts within +-3% of c1 at 128-8192 tokens with matched hints, 1-4% slower at 586;
    4/8-lane plain copies no faster than 16-lane copies. The bf16 gain was about bytes per thread, which fp32 already has'
- id: H14
  statement: Part of the ~1 us outside the CTAs at S depends on launch attributes we control; a cluster-of-2 launch cuts the
    smallest sizes.
  status: supported
  evidence:
  - 'probe r10: empty 768-CTA grid spans 1.57 us CUPTI; r6 CUPTI 4.16 vs in-kernel 3.1-3.3 us'
  - 'probe r11 E3(2): param count, launch API, dyn smem, memory-sync domain, priority, carveout (except 100) each move the real
    kernel by 0 +- 0.03 us; cluster 2 is the only attribute that moves it (-3..-4% at 128-256 tokens); cluster 4/8/16 worse'
  - 'portal r11-e3-cluster2-rtok-disp (#62670) vs r10-rtok: 128 tok -6.2%, 131 -4.2%, 256 -1.6/-3.1%'
  - 'portal c2-cluster2-s-only (#62679, clusters at <= 300 tokens only): 0.6125, new best; 128 tok 4.6 us (-4.2%), M/L unchanged'
  - 'r12 E2 mechanism: the saving is ~0.13-0.16 us outside the CTAs in every traffic mode including an EMPTY kernel (1.616 ->
    1.463 us at 768 CTAs): a cheaper launch front-end/teardown for a one-wave cluster grid. In-kernel spans are identical.
    Closed; see H16 for why it cannot extend above one wave'
- id: H15
  statement: L2 protects at most ~25-30 MB of evict_last lines (and holds a similar amount of dirty flush lines), a hardware
    cap; the store-side end state cannot be improved further.
  status: parked
  evidence:
  - 'probe r10: evict_last saves 3-4 us (~25-30 MB) at every size from 1024 to 8192 tokens; last-48/80/112 MB-only and fractional
    0.5/0.75 variants are within +-1% or worse (tested at 2048-8192 tokens only; 1024 untested, see H18)'
  - 'probe r10: H7''s cost is also ~30-40 MB worth at M/L'
  - 'r12 E1: fractional 0.75/0.5 (EF or unchanged secondary) at 900-2048 tokens: tie or lose; full evict_last 1.0 is the best
    store policy everywhere. The ~40 MB EL footprint edge (H18) is probably this cap'
- id: H16
  statement: 'Cluster launches of large grids cost on the portal: directly at the clustered sizes, and they seem to slow later
    plain launches in the same harness process; small-grid clusters do not.'
  status: supported
  evidence:
  - 'portal r11-e3-cluster2-rtok-disp: +1.6..+5.0% at 2048-8192 tokens (clustered there; bench -0.7..+1.9%) and +2.5..+2.9%
    at 586-1024 tokens where code and launch equal r10-rtok (bench +0.3..+0.6%)'
  - 'bench probe: one cluster launch does not slow later plain launches in the same process (within 1%)'
  - 'portal c2 (clusters only <= 300 tokens): 586-8192 tokens back to r10-rtok within +-0.4%, so r11''s M/L loss came from
    clustering >= 2048 tokens'
  - 'harness workload order: r11''s clustered 4,1657 / 4,1024 / 8,773 run at positions 2-4, before the plain 586/1024-token
    workloads (positions 5-9) that slowed 2.5-2.9% (single observation)'
  - 'r12 E2 mechanism: cluster CTA dispatch is slower (start spread p50 384 vs 64 ns); the empty kernel loses +0.24 us at 1536
    CTAs and +1.43 us at 6144 CTAs with cluster 2. Hidden behind memory work at 256 tokens, break-even at 1024, a loss above,
    larger at the portal''s 1500 MHz'
- id: H17
  statement: 'The cluster-of-2 gain at <= 256 tokens comes from CTA placement or dispatch order (pairs co-scheduled on one GPC/TPC,
    a different SM fill order, or paired L2 traffic), not from the launch path; the same effect can be reproduced or enlarged
    with a plain launch and a blockIdx-to-tile permutation, or with a different CTA size inside the cluster.'
  status: refuted
  evidence:
  - 'r12 E2: placement identical (5 CTAs on 120 SMs, 6 on 28; every pair on one TPC; 372/768 on die A) for plain and cluster;
    only the SM dispatch order differs (strict period-148 round robin vs GPC/TPC-pair round robin)'
  - 'r12 E2: SM-major permutation, reversed order, Q/K pairing, stagger, 128/384/512/768-thread CTAs, R=2 all tie or lose vs c2;
    no plain launch reproduces the gain'
  - 'r12 E2: the gain is a fixed ~0.15 us launch front-end saving (H14). Closed; stop S-band launch work'
- id: H18
  statement: 'The -8% from evict_first loads at 586 tokens is a footprint effect: dirty flush lines are not written back while
    the kernel''s new L2 allocations (evict_last stores plus the small evict_first recycling set) stay below a clean-capacity
    threshold somewhere between ~37 MB (586 tokens) and ~58 MB (1024 tokens). Capping the dirty-output footprint at 1024-2048
    tokens (evict_first stores for the early CTAs, evict_last for the last ~25-30 MB) recovers part of the -8% there.'
  status: refuted
  evidence:
  - 'r12 E1 curve (300-2048 tokens): the first half holds. With EF loads the dirty cost is flat ~0.55 us up to 586-700 tokens
    and the EF gain drops from -6.7% at 800 tokens (39 MB EL output) to -0.8% at 1024 (50 MB): a sharp edge at ~40-45 MB of
    evict_last output. No scored workload lies in 600-1000 tokens'
  - 'r12 E1 step 2: every hybrid loses or ties at 1024/2048 (tailEL20/30/40 +12/+4/-0.6%, headEL20/30/40 +3.9/+0.7/0.0%; 2048
    similar). The second half (capping the footprint) is refuted: EF/EN stores after the cap still evict dirty lines'
  - 'r12 E1: load policy alone (any non-EL store) changes nothing dirty; EF loads after a CLEAN flush gain 3-4% at 1536-2048
    but lose 1% dirty'
- id: H19
  statement: 'L2 bulk prefetch one resident wave ahead (r7) is additive to cluster-2 at the 256-token sizes and to R=3 at 1024
    tokens; with an evict_first cache policy on the prefetch it stops hurting at 586-2048 tokens and gains there too.'
  status: refuted
  evidence:
  - 'r12 c3 (15 interleaved reps): 256 tok c2 5.250, c2+prefetch +2.7%, c2+EF prefetch +2.4%; 586 +9.7%; 1024 R=3+prefetch +12%;
    2048 c2+EF prefetch +3%. EF policy on the prefetch is indistinguishable from plain (<= 0.3%)'
  - 'r12 c3: only positive: EF loads + prefetch at 2048 tokens -1.0% (two runs), below the bar. r7''s portal gain at 256/1024
    was most likely its EF loads + nc weights, not the prefetch. Do not revisit L2 prefetch at 128-2048 tokens'
- id: H20
  statement: 'The blockIdx-to-tile order (Q then K vs Q/K interleaved per CTA or per wave, reversed, channel-spreading permutations)
    changes DRAM efficiency by >= 2% at 2048-8192 tokens.'
  status: refuted
  evidence:
  - 'r12 c2-natural-order (5-12 interleaved reps): Q/K interleaved per CTA +3.0/+1.2/0.0% at 2048/4096/8192; per wave +1.9/+0.7/+0.1;
    reversed -0.2..-0.5 (noise); stride 1187 +6..8%; TPC-pair spread +2.3/+0.5/+0.1. A plain copy shows the same per-order deltas,
    so the effect is in the memory system. Natural adjacent order is optimal'
- id: H21
  statement: 'Our own evict_last output lines (the ~25-30 MB EL set) survive the harness''s cudaCtxResetPersistingL2Cache plus
    252 MB zero flush, so each timed call starts with the PREVIOUS call''s dirty EL outputs in L2 and writes them back inside
    its own window. Demoting our outputs to evict_normal at the end of our kernel (applypriority.global.L2::evict_normal on
    our own output range, or an equivalent last-CTA step) moves that write-back into the harness''s setup and gains up to
    ~3-4 us at 1024-8192 tokens.'
  status: refuted
  evidence:
  - 'r14 A1: harness-like loop (copy, zero, cudaCtxResetPersistingL2Cache, 265 MB zero flush), 40 interleaved reps: previous call EL vs plain moves the measured call by <= 0.35% at 128-8192 tokens; positive control without the reset +2/+4/+6 us at 1024/2048/8192. The reset demotes our EL lines and the flush evicts them outside the window: the evict_last gain is genuinely free.'
  - 'r12 E1: EL''s gain is entirely a dirty-flush effect and not parking past the window; after a clean flush all store policies
    tie. That is consistent with parked EL lines being paid for in the next window (untested)'
  - 'CUDA docs: cudaCtxResetPersistingL2Cache resets persisting (access-policy-window) lines to normal; whether it also demotes
    createpolicy evict_last lines is undocumented'
  - 'if the reset does demote them, H21 is refuted and the 3-4 us is genuinely outside the window (then H15''s cap is the limit)'
- id: H22
  statement: 'The dirty-flush cost is the in-window write-back of a residue of R MB of dirty flush lines (R ~30-40 MB) that our
    allocations evict; it scales linearly with the residue bytes evicted, and a policy combination whose allocations never
    victimise residue lines (reads recycling an evict_first set, outputs recycling their own lines) pays only the flat ~0.5 us.
    Above the ~40 MB evict_last cap, over-cap EL stores are inserted as normal lines and plain LRU evicts the (older) residue,
    which is why every store-policy hybrid failed (H18).'
  status: open
  evidence:
  - 'r12 E1: EF loads + EL stores: dirty cost flat 0.55 us up to ~40 MB of EL output, then rises to 2.1 us at 1024 and 5.8 at 2048'
  - 'r12 E1: EF+EF stores at 586 pay 2.66 us dirty (same as plain), so store allocations do NOT victimise our own EF lines first;
    this is the part of the model that a synthetic-residue sweep must test'
  - 'r10: write-only kernels pay no dirty cost, read-only pay most; copy +5-6 us at 100-400 MB'
  - 'untested: cost as a function of a KNOWN residue size; whether the residue is 35 MB or ~85 MB; whether x evict_last, st.wt,
    the qualifier-form evict_last, or an applypriority demotion of the oldest outputs changes the slope'
- id: H23
  statement: 'Async-proxy memory operations (cp.async.bulk stores from shared memory, cp.async.bulk loads with an L2 cache hint)
    allocate in L2 differently from LDG/STG (bulk stores may not create dirty normal lines; bulk loads may honour evict_first
    recycling), so a one-shot kernel with a bulk store path or bulk load path pays less of the dirty-flush cost at 586-2048
    tokens, and a bulk store shortens the 0.67 us store/exit tail at 128 tokens.'
  status: open
  evidence:
  - 'r10: bulk stores 27% slower than STG.256 at 805 MB (ring design, policy unclear); r10-bulk1d-ring-stel with EL bulk stores
    was within 1.3% of c2 at L but +9% at M and +23% at S from its ring prologue; dirty-vs-clean was never measured for either'
  - 'r11 E3(3): the store phase adds 0.67 us to the 128-token in-kernel span after the last load returns (compute + L2 write +
    ack + exit); a bulk store needs one wait_group.read before exit'
  - 'H5 (bandwidth) is refuted; this is about L2 allocation state and drain latency only'
- id: H24
  statement: 'The public #1 (0.6275) is not faster at S or at the L read ceiling; it pays about half of the dirty-flush cost at
    586-8192 tokens (M -7..-10%, L -3%, 586 -5%), which predict_score puts at 0.627-0.634. Any mechanism that halves H7 for us
    ties or passes it.'
  status: open
  evidence:
  - 'r14: two fresh-eyes sessions (no project history; Fable and Opus) converged on our design family (one-shot LDG.256, evict_first loads, evict_last stores) and our speed: a textbook kernel predicts 0.611, our S edge 0.1-0.3 us remains. No overlooked simple kernel; the 0.55 us/call gap to #1 is not a kernel-design gap we can see'
  - 'arithmetic r13: the gap is 0.24 summed score; from S alone it needs 0.9 us on each of five S workloads (implausible: H10);
    from L alone 8% (7.5 TB/s effective, above the dirty-L2 copy ceiling, H11); uniform 3.5% gives 0.6274'
  - 'predict_score: S -5 / M -7.5 / L -3 -> 0.634; M -10 alone -> 0.627; the dirty pool (H7) is the only identified cost of that size'
- id: H25
  statement: 'Part of the public #1''s ~0.55 us per call over us is launch timing, not kernel speed: a kernel launched ~60 us after the harness flush memset (slow Python/torch.compile dispatch, or a deliberate delay) measures ~0.4 us faster at small sizes, and may also avoid part of the dirty-L2 write-back cost (H7) at M/L.'
  status: open
  evidence:
  - '#84 r1 E1 (rented B200): same Triton kernel at 131 elements after a CPU wait of 0/20/60/150 us: 2.11/1.89/1.73/1.73 us; 16384: 2.59 -> 2.40; 786432: 4.80 -> 4.64; 16.8M: 42.70 -> 42.53. torch.compile(reference) as a callable 1.58-1.76 us at 131 vs the same kernel launched directly 2.03-2.08'
  - 'not usable by us (constraint: no deliberate launch delay); worth a question to NVIDIA about the harness waiting after its flush'
