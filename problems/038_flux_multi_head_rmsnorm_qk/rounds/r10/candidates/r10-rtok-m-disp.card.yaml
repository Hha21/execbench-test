id: r10-rtok-m-disp
parents:
  - r6-s-ldef-nc-disp
operation: new_design
language: cuda_cpp
niche:
  mem: ldg256
  st: direct
  grid: oneshot
  launch: fused
  tile: token
  red: halfwarp
  cache: stream
  spec: dispatch:size
hypothesis: >-
  Wildcard result, mostly negative. First I measured where the time goes, using per-CTA globaltimer timelines
  on the rented B200. The harness's zero-fill flush leaves the L2 full of dirty lines, and every line we
  allocate forces a write-back. That costs about 20% of the in-kernel time at 12.6 MB and about 35% at 100 MB,
  measured against a flush that leaves clean lines. No cache hint changes it. Bytes in flight per thread and
  CTA shape are also not limiting. The one structural idea with a measurable gain is kept. A thread handles
  R = 3 tokens of the same head (rows h, h+48, h+96), so one weight load serves 3 rows and 96 B of x loads are
  in flight per thread. The kernel runs 5 CTAs/SM with 48 registers, and it is used only for
  600 < B*S <= 1100 (the three 1024-token workloads). It measured -1.7 to -4.0% there in two separate
  run_tests. Every other size runs r6's code unchanged.
expected_effect:
  S:
    pct: 0
    confidence: high
  M:
    pct: -1.5
    confidence: low
  L:
    pct: 0
    confidence: high
resources_sm100a:
  regs_per_thread: 48
  smem_per_cta_bytes: 0
  threads_per_cta: 256
  ctas_per_sm: 5
  bytes_in_flight_per_sm: 122880
  launches_per_call: 1
knobs:
  R_M: 3
  MINB_M: 5
  M_RANGE: "600 < B*S <= 1100"
  S_MAX_TOKENS: 600
  store_policy: "L2 evict_last fraction 1.0 (all sizes)"
dispatch:
  - max_tokens: 600
    kernel: qk_rms_rtok<1,true,8>
    meta:
      R: 1
      loads: "x evict_first cache_hint, w nc (= r6 S path)"
  - max_tokens: 1100
    kernel: qk_rms_rtok<3,false,5>
    meta:
      R: 3
      note: "3 same-head tokens per thread, one weight load"
  - max_tokens: null
    kernel: qk_rms_rtok<1,false,8>
    meta:
      R: 1
      note: "identical to r6 / r5"
findings:
  - "probe timeline, 12.6 MB: all 768 CTAs start within 0.06 us (one wave, 5-6 CTAs on every SM, spread over the GPCs); the first load returns at 0.67 us, the median at 1.6 us, the last at 2.9 us; in-kernel span 3.1-3.3 us against a 4.16 us CUPTI time, so about 1 us lies outside the CTAs (launch and teardown) [probe_b200]"
  - "probe, 25 MB: r6's 1536 CTAs exceed the 1184 resident slots (8/SM), so CTA starts spread over 2.7 us (a second partial wave); making it one wave with 2-4 rows per thread does not make it faster [probe_b200]"
  - "probe, dirty-L2 cost: in-kernel span after the harness-style zero flush vs a read-only flush (clean lines): 12.6 MB 3.07 vs 2.56 us, 25 MB 4.10 vs 3.58, 100 MB 16.6 vs 12.3; a read-only kernel shows the same (12.0 vs 8.2 us at 100 MB). Write-backs of the flush's dirty lines are 20-35% of the kernel time and are the main remaining cost at S/M [probe_b200]"
  - "dead end: load hints do not stop those write-backs. x via cache_hint EF, the .L2::evict_first qualifier, .cs, .lu or nc+EF all score within +-2% of default at 128-4096 tokens. Probable reason: an output line's L2 set rarely holds one of our clean input lines, so its victim is still a dirty flush line. Exception: EF x loads gave -6% at 586 tokens once (r6 already uses them there) [probe_b200]"
  - "dead end: the .L2::evict_last store qualifier vs cache_hint+createpolicy evict_last: same within noise at every size [probe_b200]"
  - "dead end: R tokens per thread sharing one weight load (R = 2, 3, 4; 128- and 256-thread CTAs; 64-128 KB in flight per SM) does not beat r6 at S or L (+0 to +4%); R=2 at 8 CTAs/SM spills (STACK 16) and is 5-20% slower. Bytes in flight are not the B200 limit; DRAM plus the dirty write-backs are [probe_b200]"
  - "kept: R=3 at 1024 tokens measured -2.9/-3.4/-1.8% and -3.2/-4.0/-1.7% in two run_tests; at 2048 tokens it was +0.5% (dropped). Bench noise between identical code paths was up to +-2.4% in the same runs [run_tests]"
  - "at S the in-kernel span is about read bytes plus write-back bytes over DRAM bandwidth, plus a fixed ~1 us outside the CTAs; no kernel-side gain of 3% or more is visible at S unless the write-backs can be avoided legitimately (they cannot via hints; discard on inputs counts as touching memory we do not own) [INFERRED from the probes]"
paths:
  - max_tokens: 600
    lang: cuda
    width: 256
    threads: 256
    rows: 16
    grid: oneshot
    x: ef
    w: nc
    st: el
  - max_tokens: 1100
    lang: cuda
    width: 256
    threads: 256
    rows: 48
    grid: oneshot
    st: el
  - max_tokens: null
    lang: cuda
    width: 256
    threads: 256
    rows: 16
    grid: oneshot
    st: el
runs_on:
  H200:
    runs: true
    representative: false
    note: "128-bit fallback, 50 MB L2"
  A100:
    runs: true
    representative: false
  L40S:
    runs: true
    representative: false
risks:
  - "The 1024-token gain (-2 to -4% on the bench) is close to bench noise; the portal may show nothing. The 48-register path can lose more at 1500 MHz if it is partly SM-bound."
  - "Emulator prediction 0.6100 +- 0.009 vs the current best 0.6099: a coin flip at the score level."
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
