hypothesis: 'Portal measurement, not a contender. Workloads with equal B*S do identical work and agree within ~0.2-0.5% inside
  one submission, so each group runs c2 on one shape and a variant on the others: 256 tok 2x128 c2 / 1x256 r7; 1024 tok 1x1024
  c2 / 8x128 r7 / 4x256 F1; 2048 tok 4x512 c2 / 8x256 c2 R=3; 4096 tok 16x256 c2 / 32x128 c2 EF x + nc w / 4x1024 F1. Other
  shapes run c2.'
dispatch:
- shape: 1x256, 8x128
  kernel: r7 qk_rms_kernel<true> (EF x, nc w, EL st, L2 prefetch 1 wave ahead)
- shape: 4x256, 4x1024
