id: r1-rope-v4nc-s128
parents: [r0-rope-ldg256-os-stel]
operation: knob_mutation
language: cuda_cpp
niche:
  mem: ldg128
  st: direct
  grid: oneshot
  launch: fused
  tile: rows8
  red: warp
  cache: default
  spec: dispatch:size
hypothesis: >-
  The 256-bit accesses (8 lanes per row, 64 threads) add latency and cost S/M time. Moving to 128-bit accesses with
  16 lanes per row (32 regs, 128 threads for 8 rows) keeps the row contiguous per instruction, doubles the thread count
  and removes the 256-bit split, so it is faster at every size. Keeping .nc on x and the tables helps at 36-100 MB.
expected_effect:
  S: {pct: -9, confidence: medium}
  M: {pct: -6, confidence: medium}
  L: {pct: -6, confidence: low}
resources_sm100a:
  regs_per_thread: 32
  smem_per_cta_bytes: 0
  threads_per_cta: 128
  ctas_per_sm: 16
  bytes_in_flight_per_sm: 131072
  launches_per_call: 1
knobs: {THREADS_S: 128, THREADS_L: 256, ROWS_S: 8, ROWS_L: 16, row_threshold: 262144, store_hint: evict_last}
dispatch:
  - {max_rows: 262144, kernel: rope_kernel<128>, meta: {threads: 128, rows: 8}}
  - {max_rows: null, kernel: rope_kernel<256>, meta: {threads: 256, rows: 16}}
tests: [H12, H7, H6]
findings:
  - "H12 supported: the gap is in the load/store width and layout, not the hints. Plain vs nc/no_allocate x loads or table loads (8 lanes, 256-bit) and plain vs cache_hint stores at 2.2 MB: all within 0.03 us of r0 (2.98 us); at 6.6 MB plain stores are +0.06 us [probe_b200, 5 interleaved repeats]"
  - "2.2 MB (median us, 5 repeats): r0 2.98; x plain 2.98; table plain 3.01; plain stores 2.99; 32-thr 4-row 256-bit 2.72; 16 lanes v4 128 thr all-plain 2.67 / 2.59 in the second session; v4 + evict_last stores 2.59; v4 nc 2.59; v4 at 64/256 threads 2.62; v2 (32 lanes) 2.59; no-table probe (constants) 2.69; plain copy 2.64 (v4 copy 2.56). The kernel is now at the copy floor [probe_b200]"
  - "6.6 MB: r0 3.58; v4_el128 3.46; v4 plain stores 3.55; 32-thr 4-row 256-bit 3.46; 32-thr 2-row v4 plain 3.91 (worse); no-table 3.36; copy 3.31 [probe_b200]"
  - "15.8 MB: r0 4.83; v4_el 4.61; v4 with plain stores 4.96 (+3%, evict_last stores matter here); 32-thr 256-bit 4.83; no-table copy 4.45 [probe_b200]"
  - "36 MB: r0 7.68; v4_el128 6.85; v4 nc + el 6.63; 64-thr v4 7.65; v4 plain stores 8.03; copy 6.56 [probe_b200]"
  - "57-102 MB: r0 10.5/16.5 (54.6k/99k rows); v4 plain loads el 9.66/14.98; v4 nc el 8.99/14.79 (-15%/-10%). x plain + table nc 9.69/15.01; x nc + table plain 9.01/14.78: the nc on x is what matters at 57 MB [probe_b200]"
  - "134-269 MB: r0 19.83/39.17; v4 nc 128 19.17/38.95; v4 plain 128 18.95/38.77 (within 1-3%) [probe_b200]"
  - "L band, 256-thread v4 vs r0 256-thread 8-lane: 322 MB 46.3 vs 49.7 (-6.7%); 354 MB 51.2 vs 54.9 (-6.8%); 612 MB 92.8 vs 93.8 (-1%); 2689 MB 389.4 vs 396.2 (-1.7%). 128 and 256 threads tie within 0.3% at L [probe_b200]"
  - "dead end: v2 / 32 lanes per row is slower above 6 MB (+10-20%); 32-thread CTAs with 2 rows (v4) are +9% at 6.6 MB; 32-thread 4-row 256-bit is no better than r0 above 15 MB [probe_b200]"
  - "run_tests full 16/16 pass vs r0 on the same B200: S -9.4%, M -6.2%, L -6.3% geomean; 2.2 MB 2.6 vs 2.9 (-10.9%), 6.6 MB -1.7%, 15.8 MB -7.5%, 36 MB -12.7%, 57 MB -13.6%; predicted portal 0.665 [run_tests]"
  - "compile: 32 regs, 0 spills, LDG.128 x12 (4 of them .NA), STG.128 x4 per thread [compile_b200]"
paths:
  - {max_tokens: null, max_rows: 262144, lang: cuda, width: 128, threads: 128, rows: 8, grid: oneshot, mem: ldg, wstat: false, launches: 1, prefetch: false, x: nc_noalloc, w: nc, st: el}
  - {max_tokens: null, max_rows: null, lang: cuda, width: 128, threads: 256, rows: 16, grid: oneshot, mem: ldg, wstat: false, launches: 1, prefetch: false, x: nc_noalloc, w: nc, st: el}
runs_on:
  H200: {runs: false, representative: false, note: "createpolicy.fractional.L2::evict_last may compile on sm_90a, but not measured; B200 timings only"}
  A100: {runs: false, representative: false}
  L40S: {runs: false, representative: false}
risks:
  - "The 6.6 MB gain is only 1.7% on the bench; the portal ratio at S has been 1.19, so a smaller gain there is possible"
  - "The picture is that the gain is B200-specific (256-bit LDG/STG split); it came from the bench B200 at unlocked clocks and might shrink under the portal's 1.5 GHz lock"
  - "binding now checks 16-byte alignment only, which the harness's 256-byte-aligned pointers always satisfy"
measure_first: [B200]
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
